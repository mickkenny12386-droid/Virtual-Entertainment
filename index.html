<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Stage Entertainment | Professional Live System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --seat-free: #0055ff; 
            --seat-selected: #28a745;
            --gold: #c5a059; --dark-red: #4a0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        /* Slideshow Background Fix (No Ads) */
        .bg-slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }
        .bg-img { 
            position: absolute; width: 100%; height: 100%; object-fit: cover; 
            opacity: 0; transition: opacity 2s ease-in-out; filter: brightness(0.3);
        }
        .bg-img.active { opacity: 1; }

        nav { background: rgba(0,0,0,0.95); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--gold); }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: 700; color: #ddd; }

        .page { display: none; padding: 120px 5% 50px; min-height: 100vh; }
        .page.active { display: block; }

        /* Theater Layout AFAS */
        .theater-wrapper { background: var(--dark-red); padding: 50px; border-radius: 40px; border: 4px solid #1a0000; display: flex; flex-direction: column; align-items: center; max-width: 900px; margin: 0 auto; }
        .stage-area { width: 300px; height: 10px; background: #111; margin-bottom: 40px; border-radius: 5px; }
        
        .row { display: flex; gap: 6px; margin-bottom: 8px; }
        .seat { width: 24px; height: 24px; background: var(--seat-free); border-radius: 4px; cursor: pointer; }
        .seat.selected { background: var(--seat-selected); box-shadow: 0 0 10px var(--seat-selected); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #0a0a0a; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 15px; }

        .admin-box { background: #0a0a0a; padding: 30px; border-radius: 10px; border: 1px solid var(--gold); max-width: 500px; margin: 0 auto; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #444; color: #fff; }
        .btn { background: var(--gold); color: #000; padding: 12px; border: none; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-slideshow">
        <img src="https://i.imgur.com/e4a1bd.jpg" class="bg-img active" id="bg1"> <img src="https://i.imgur.com/e4a257.png" class="bg-img" id="bg2">        </div>

    <nav>
        <div style="font-family:'Playfair Display'; font-size: 22px; color: var(--gold);">STAGE ENTERTAINMENT</div>
        <div class="nav-links">
            <span class="nav-link" onclick="showPage('home')">Musicals</span>
            <span class="nav-link" onclick="showPage('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="showPage('news-page')">Nieuws</span>
            <button onclick="showPage('login-page')" style="background:#8b0000; color:white; border:none; padding:8px 15px; cursor:pointer;">ADMIN</button>
        </div>
    </nav>

    <section id="home" class="page active">
        <h1>Musicals</h1>
        <div id="shows-cont" class="grid"></div>
    </section>

    <section id="theaters-page" class="page">
        <h1>Theaters</h1>
        <div id="th-cont" class="grid"></div>
    </section>

    <section id="news-page" class="page">
        <h1>Laatste Nieuws</h1>
        <div id="news-cont" class="grid"></div>
    </section>

    <section id="seating-page" class="page">
        <h2 id="seat-head" style="text-align:center; margin-bottom:20px;"></h2>
        <div class="theater-wrapper">
            <div class="stage-area"></div>
            <div id="afas-grid"></div>
        </div>
        <button class="btn" style="max-width:200px; margin: 20px auto; display:block;" onclick="confirmBooking()">Tickets Bestellen</button>
    </section>

    <section id="login-page" class="page">
        <div class="admin-box">
            <h2>Admin Login</h2>
            <input type="password" id="admin-pass" placeholder="Wachtwoord">
            <button class="btn" onclick="checkAdmin()">Login</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div class="admin-box" style="max-width:800px;">
            <h2>Beheer Panel</h2>
            <select id="admin-type" onchange="toggleAdminForm()">
                <option value="shows">Musical Toevoegen</option>
                <option value="theaters">Theater Toevoegen</option>
                <option value="news">Nieuws Posten</option>
            </select>
            <div id="admin-form-fields">
                <input type="text" id="field1" placeholder="Naam/Titel">
                <input type="text" id="field2" placeholder="Afbeelding URL">
                <textarea id="field3" placeholder="Beschrijving/Info"></textarea>
            </div>
            <button class="btn" onclick="saveAdminData()">Data Opslaan</button>
        </div>
    </section>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS8qIsJTEznHjCOjaP_XzsFzvIryoes18",
            authDomain: "vrtrtr-b9978.firebaseapp.com",
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vrtrtr-b9978",
            storageBucket: "vrtrtr-b9978.appspot.com",
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        // Background Slideshow Logic
        let currentBg = 1;
        setInterval(() => {
            document.getElementById('bg' + currentBg).classList.remove('active');
            currentBg = currentBg === 1 ? 2 : 1;
            document.getElementById('bg' + currentBg).classList.add('active');
        }, 8000);

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // AFAS Seating Generator (3-8-3, 7 rijen)
        function renderAFAS() {
            const cont = document.getElementById('afas-grid');
            cont.innerHTML = "";
            for(let r=1; r<=7; r++) {
                const row = document.createElement('div');
                row.className = "row";
                // Links (3)
                for(let s=1; s<=3; s++) row.innerHTML += `<div class="seat" onclick="this.classList.toggle('selected')"></div>`;
                row.innerHTML += `<div style="width:20px"></div>`;
                // Midden (8)
                for(let s=1; s<=8; s++) row.innerHTML += `<div class="seat" onclick="this.classList.toggle('selected')"></div>`;
                row.innerHTML += `<div style="width:20px"></div>`;
                // Rechts (3)
                for(let s=1; s<=3; s++) row.innerHTML += `<div class="seat" onclick="this.classList.toggle('selected')"></div>`;
                cont.appendChild(row);
            }
        }

        function openBooking(name) {
            document.getElementById('seat-head').innerText = name + " - AFAS Circustheater";
            renderAFAS();
            showPage('seating-page');
        }

        // Data Rendering
        rtdb.ref('/').on('value', snap => {
            const data = snap.val() || {};
            renderList('shows-cont', data.shows, true);
            renderList('th-cont', data.theaters, false);
            renderList('news-cont', data.news, false);
        });

        function renderList(id, obj, isMusical) {
            const cont = document.getElementById(id);
            cont.innerHTML = "";
            if(!obj) return;
            Object.values(obj).forEach(item => {
                cont.innerHTML += `
                    <div class="card">
                        <img src="${item.img}">
                        <div class="card-content">
                            <h3>${item.name}</h3>
                            <p>${item.info || ''}</p>
                            ${isMusical ? `<button class="btn" onclick="openBooking('${item.name}')">Tickets</button>` : ''}
                        </div>
                    </div>`;
            });
        }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === "Virtual2025") showPage('admin-dashboard');
            else alert("Fout wachtwoord");
        }

        function saveAdminData() {
            const type = document.getElementById('admin-type').value;
            const id = Date.now();
            rtdb.ref(type + '/' + id).set({
                name: document.getElementById('field1').value,
                img: document.getElementById('field2').value,
                info: document.getElementById('field3').value
            }).then(() => alert("Succesvol toegevoegd!"));
        }

        showPage('home');
    </script>
</body>
</html>
