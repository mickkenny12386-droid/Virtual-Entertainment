<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Stage Entertainment | Live System Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --gold: #c5a059; --dark-red: #4a0000;
            --seat-free: #0055ff; --seat-selected: #28a745; --seat-occupied: #222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        /* Background */
        .bg-slideshow { position: fixed; inset: 0; z-index: -2; background: #000; }
        .bg-img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 2s; filter: brightness(0.2); }
        .bg-img.active { opacity: 1; }

        nav { background: rgba(0,0,0,0.95); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--gold); }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: 700; color: #ddd; }

        .page { display: none; padding: 120px 5% 50px; min-height: 100vh; }
        .page.active { display: block; }

        /* Musical Selector Layout */
        .content-wrapper { display: flex; gap: 20px; transition: 0.5s; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; flex-grow: 1; transition: 0.5s; }
        .grid.fade { opacity: 0.1; pointer-events: none; }

        .card { position: relative; height: 400px; border-radius: 10px; overflow: hidden; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card:hover { transform: scale(1.02); border-color: var(--gold); }

        /* Side Info Panel */
        #side-panel { width: 0; opacity: 0; background: rgba(15,15,15,0.98); border-left: 3px solid var(--gold); position: fixed; right: 0; top: 75px; height: calc(100vh - 75px); transition: 0.5s; overflow-y: auto; z-index: 900; }
        #side-panel.open { width: 500px; opacity: 1; padding: 40px; }

        /* Seating & Rangen */
        .theater-box { background: var(--dark-red); padding: 30px; border-radius: 20px; margin-top: 20px; text-align: center; }
        .row { display: flex; gap: 5px; justify-content: center; margin-bottom: 8px; }
        .seat { width: 20px; height: 20px; background: var(--seat-free); border-radius: 4px; cursor: pointer; }
        .seat.selected { background: var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied); cursor: not-allowed; }
        
        .rang-btn { width: 100%; padding: 15px; margin: 10px 0; background: #222; border: 1px solid var(--gold); color: #fff; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .rang-btn:hover { background: var(--gold); color: #000; }
        .sold-out { color: #ff4444; font-weight: bold; font-size: 24px; margin: 20px 0; }

        /* Admin Tools */
        .admin-item { background: #111; padding: 15px; border-radius: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .del-btn { background: #ff4444; color: #fff; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        
        .btn-gold { background: var(--gold); color: #000; padding: 15px; border: none; width: 100%; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="bg-slideshow">
        <img src="https://i.imgur.com/e4a1bd.jpg" class="bg-img active" id="bg1">
        <img src="https://i.imgur.com/e4a257.png" class="bg-img" id="bg2">
    </div>

    <nav>
        <div style="font-family:'Playfair Display'; font-size: 22px; color: var(--gold); cursor:pointer;" onclick="closePanel()">STAGE ENTERTAINMENT</div>
        <div class="nav-links">
            <span class="nav-link" onclick="showPage('home')">Musicals</span>
            <span class="nav-link" onclick="showPage('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="showPage('news-page')">Nieuws</span>
            <span class="nav-link" onclick="showPage('account-page')" style="color:var(--gold)">Mijn Account</span>
            <button style="background:#8b0000; color:white; border:none; padding:8px 15px; cursor:pointer; border-radius:4px;" onclick="showPage('login-page')">ADMIN</button>
        </div>
    </nav>

    <section id="home" class="page active">
        <div class="content-wrapper">
            <div id="shows-cont" class="grid"></div>
        </div>
    </section>

    <div id="side-panel">
        <button onclick="closePanel()" style="background:none; border:none; color:#fff; font-size:30px; cursor:pointer; float:right;">&times;</button>
        <div id="side-content"></div>
    </div>

    <section id="theaters-page" class="page">
        <h1>Onze Theaters</h1>
        <div id="th-cont" class="grid"></div>
    </section>

    <section id="news-page" class="page">
        <h1>Nieuws</h1>
        <div id="news-cont" style="display:flex; flex-direction:column; gap:15px;"></div>
    </section>

    <section id="account-page" class="page">
        <h1>Mijn Tickets</h1>
        <div id="my-tickets-cont"></div>
    </section>

    <section id="login-page" class="page">
        <div style="max-width:350px; margin:0 auto; background:#111; padding:30px; border-radius:10px; border:1px solid var(--gold);">
            <h2 style="text-align:center; margin-bottom:20px;">Admin Login</h2>
            <input type="password" id="admin-pass" placeholder="Wachtwoord" style="width:100%; padding:12px; margin-bottom:15px; background:#000; border:1px solid #444; color:#fff;">
            <button class="btn-gold" onclick="checkAdmin()">Inloggen</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div style="max-width:800px; margin:0 auto;">
            <h2 style="margin-bottom:20px;">Beheer Producties</h2>
            <div style="background:#111; padding:20px; border-radius:10px; margin-bottom:30px;">
                <select id="adm-type" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff;">
                    <option value="shows">Musical Toevoegen</option>
                    <option value="news">Nieuws Toevoegen</option>
                    <option value="theaters">Theater Toevoegen</option>
                </select>
                <input type="text" id="adm-name" placeholder="Naam/Titel" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff;">
                <input type="text" id="adm-img" placeholder="Foto URL" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff;">
                <input type="text" id="adm-dates" placeholder="Datums (bv: 12 Maart, 14 Maart, 20 April)" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff;">
                <select id="adm-theater" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff;">
                    <option value="AFAS Circustheater">AFAS Circustheater</option>
                    <option value="Efteling Theater">Efteling Theater</option>
                </select>
                <textarea id="adm-info" placeholder="Beschrijving" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff; height:100px;"></textarea>
                <button class="btn-gold" onclick="saveData()">Item Opslaan</button>
            </div>
            <div id="admin-lists"></div>
        </div>
    </section>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS8qIsJTEznHjCOjaP_XzsFzvIryoes18",
            authDomain: "vrtrtr-b9978.firebaseapp.com",
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vrtrtr-b9978",
            storageBucket: "vrtrtr-b9978.appspot.com",
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let currentMusical = null;
        let selectedSeats = [];
        const mySession = "User_" + Math.floor(Math.random() * 9999);

        // Background transition
        setInterval(() => {
            const b1 = document.getElementById('bg1'), b2 = document.getElementById('bg2');
            b1.classList.toggle('active'); b2.classList.toggle('active');
        }, 8000);

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            closePanel();
            if(id === 'account-page') loadMyTickets();
            if(id === 'admin-dashboard') loadAdminLists();
        }

        // Database listener
        rtdb.ref('/').on('value', snap => {
            const data = snap.val() || {};
            renderShows(data.shows);
            renderNews(data.news);
            renderTheaters(data.theaters);
        });

        function renderShows(shows) {
            const cont = document.getElementById('shows-cont');
            cont.innerHTML = "";
            if(!shows) return;
            Object.values(shows).forEach(s => {
                cont.innerHTML += `
                    <div class="card" onclick="openPanel('${s.id}')">
                        <img src="${s.img}">
                    </div>`;
            });
        }

        function openPanel(id) {
            rtdb.ref('shows/' + id).once('value', snap => {
                const s = snap.val();
                currentMusical = s;
                document.getElementById('shows-cont').classList.add('fade');
                const panel = document.getElementById('side-panel');
                const content = document.getElementById('side-content');
                panel.classList.add('open');

                content.innerHTML = `
                    <h2 style="color:var(--gold); font-size:30px;">${s.name}</h2>
                    <p style="margin:20px 0; line-height:1.6; color:#ccc;">${s.info}</p>
                    <p><strong>Locatie:</strong> ${s.theater}</p>
                    <p><strong>Beschikbare Datums:</strong> ${s.dates || 'Geen datums'}</p>
                    <div id="booking-area"></div>
                `;

                if(s.theater === "AFAS Circustheater") {
                    renderAFAS(id);
                } else {
                    renderEfteling(id);
                }
            });
        }

        function closePanel() {
            document.getElementById('side-panel').classList.remove('open');
            document.getElementById('shows-cont').classList.remove('fade');
        }

        // AFAS SEATING
        function renderAFAS(showId) {
            const area = document.getElementById('booking-area');
            area.innerHTML = `<h3>Kies je stoelen</h3><div class="theater-box" id="seat-grid"></div><button class="btn-gold" onclick="bookAFAS()">Bestellen</button>`;
            const grid = document.getElementById('seat-grid');
            
            rtdb.ref('seats/' + showId).on('value', snap => {
                const occupied = snap.val() || {};
                grid.innerHTML = "";
                let totalFree = 0;

                for(let r=1; r<=7; r++) {
                    const row = document.createElement('div');
                    row.className = "row";
                    const createBlock = (count, prefix) => {
                        for(let s=1; s<=count; s++) {
                            const sid = `${prefix}-R${r}-S${s}`;
                            const seat = document.createElement('div');
                            seat.className = "seat";
                            if(occupied[sid]) {
                                seat.classList.add('occupied');
                            } else {
                                totalFree++;
                                seat.onclick = () => {
                                    seat.classList.toggle('selected');
                                    if(selectedSeats.includes(sid)) selectedSeats = selectedSeats.filter(x => x !== sid);
                                    else selectedSeats.push(sid);
                                };
                            }
                            row.appendChild(seat);
                        }
                    };
                    createBlock(3, "L"); row.innerHTML += '<div style="width:20px"></div>';
                    createBlock(8, "C"); row.innerHTML += '<div style="width:20px"></div>';
                    createBlock(3, "R");
                    grid.appendChild(row);
                }
                if(totalFree === 0) area.innerHTML = '<div class="sold-out">UITVERKOCHT</div>';
            });
        }

        // EFTELING RANGEN
        function renderEfteling(showId) {
            const area = document.getElementById('booking-area');
            area.innerHTML = `
                <h3>Selecteer Rang</h3>
                <div class="theater-box">
                    <button class="rang-btn" onclick="bookRang('Rang I')">RANG I (Goud)</button>
                    <button class="rang-btn" onclick="bookRang('Rang II')">RANG II (Zilver)</button>
                    <button class="rang-btn" onclick="bookRang('Rang III')">RANG III (Brons)</button>
                </div>
            `;
        }

        function bookAFAS() {
            if(selectedSeats.length === 0) return alert("Kies eerst stoelen!");
            const bid = "T-" + Date.now();
            selectedSeats.forEach(sid => rtdb.ref('seats/' + currentMusical.id + '/' + sid).set(true));
            rtdb.ref('bookings/' + mySession + '/' + bid).set({
                musical: currentMusical.name,
                theater: currentMusical.theater,
                info: "Stoelen: " + selectedSeats.join(', '),
                time: new Date().toLocaleString()
            }).then(() => { alert("Gereserveerd!"); showPage('account-page'); });
        }

        function bookRang(rang) {
            const bid = "T-" + Date.now();
            rtdb.ref('bookings/' + mySession + '/' + bid).set({
                musical: currentMusical.name,
                theater: currentMusical.theater,
                info: rang,
                time: new Date().toLocaleString()
            }).then(() => { alert("Gereserveerd voor " + rang); showPage('account-page'); });
        }

        function loadMyTickets() {
            const cont = document.getElementById('my-tickets-cont');
            rtdb.ref('bookings/' + mySession).once('value', snap => {
                const data = snap.val();
                if(!data) { cont.innerHTML = "Je hebt nog geen tickets."; return; }
                cont.innerHTML = Object.entries(data).map(([id, t]) => `
                    <div class="admin-item" style="border-left:5px solid var(--gold)">
                        <div>
                            <strong>${t.musical}</strong><br>
                            <small>${t.theater} - ${t.info}</small>
                        </div>
                    </div>
                `).join('');
            });
        }

        // ADMIN LOGIC
        function checkAdmin() {
            if(document.getElementById('admin-pass').value === "Virtual2025") showPage('admin-dashboard');
        }

        function saveData() {
            const type = document.getElementById('adm-type').value;
            const id = Date.now();
            const data = {
                id: id,
                name: document.getElementById('adm-name').value,
                img: document.getElementById('adm-img').value,
                info: document.getElementById('adm-info').value,
                theater: document.getElementById('adm-theater').value,
                dates: document.getElementById('adm-dates').value
            };
            rtdb.ref(type + '/' + id).set(data).then(() => { alert("Toegevoegd!"); loadAdminLists(); });
        }

        function loadAdminLists() {
            const cont = document.getElementById('admin-lists');
            cont.innerHTML = "<h3>Huidige Items (Verwijderen)</h3>";
            ['shows', 'news', 'theaters'].forEach(type => {
                rtdb.ref(type).once('value', snap => {
                    if(!snap.val()) return;
                    Object.values(snap.val()).forEach(item => {
                        cont.innerHTML += `
                            <div class="admin-item">
                                <span>[${type}] ${item.name}</span>
                                <button class="del-btn" onclick="deleteItem('${type}', '${item.id}')">Verwijderen</button>
                            </div>
                        `;
                    });
                });
            });
        }

        function deleteItem(type, id) {
            if(confirm("Zeker weten?")) rtdb.ref(type + '/' + id).remove().then(() => loadAdminLists());
        }

        // Andere renders
        function renderNews(news) {
            const cont = document.getElementById('news-cont');
            cont.innerHTML = news ? Object.values(news).map(n => `<div class="admin-item"><strong>${n.name}</strong><br>${n.info}</div>`).join('') : "";
        }
        function renderTheaters(th) {
            const cont = document.getElementById('th-cont');
            cont.innerHTML = th ? Object.values(th).map(t => `<div class="card"><img src="${t.img}"><div style="padding:10px">${t.name}</div></div>`).join('') : "";
        }

        showPage('home');
    </script>
</body>
</html>
