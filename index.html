<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Entertainment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-panel { transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .hero-panel:hover { flex: 2; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="absolute top-0 w-full flex justify-between items-center p-6 z-50 text-white">
        <div class="text-2xl font-bold tracking-tighter">Virtual Entertainment</div>
        <div class="hidden md:flex gap-8 text-sm uppercase tracking-widest">
            <a href="#" class="hover:text-blue-400">Home</a>
            <a href="#" class="hover:text-blue-400">Productions</a>
            <a href="#" class="hover:text-blue-400">Theatres</a>
        </div>
        <button class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full text-sm font-semibold transition">Find Tickets</button>
    </nav>

    <section class="h-screen w-full flex overflow-hidden bg-black">
        <div class="hero-panel flex-1 bg-cover bg-center relative" style="background-image: url('https://placehold.co/800x1000/1e3a8a/white?text=Show+1')"></div>
        <div class="hero-panel flex-1 bg-cover bg-center relative" style="background-image: url('https://placehold.co/800x1000/2563eb/white?text=Show+2')"></div>
        <div class="hero-panel flex-1 bg-cover bg-center relative" style="background-image: url('https://placehold.co/800x1000/3b82f6/white?text=Show+3')"></div>
        <div class="hero-panel flex-1 bg-cover bg-center relative" style="background-image: url('https://placehold.co/800x1000/60a5fa/white?text=Show+4')"></div>
        <div class="hero-panel flex-1 bg-cover bg-center relative" style="background-image: url('https://placehold.co/800x1000/93c5fd/white?text=Show+5')"></div>
    </section>

    <section class="py-20 px-6 max-w-7xl mx-auto">
        <h2 class="text-3xl font-bold text-center mb-12">Discover our productions</h2>
        
        <div class="relative flex items-center">
            <button id="prevBtn" class="p-3 bg-white shadow-lg rounded-full hover:bg-blue-50">←</button>
            <div id="carousel" class="flex overflow-x-auto gap-6 px-4 scroll-smooth w-full">
                <!-- Data wordt hier door JS ingevuld -->
            </div>
            <button id="nextBtn" class="p-3 bg-white shadow-lg rounded-full hover:bg-blue-50">→</button>
        </div>
    </section>

    <script>
        // JE KUNT HIER PRODUCTIES TOEVOEGEN OF VERWIJDEREN
        const productions = [
            { name: "The Lion King", city: "Paris", img: "https://placehold.co/400x400/blue/white?text=Lion+King" },
            { name: "Frozen", city: "The Hague", img: "https://placehold.co/400x400/blue/white?text=Frozen" },
            { name: "Romeo & Julia", city: "Berlin", img: "https://placehold.co/400x400/blue/white?text=Romeo+Julia" },
            { name: "Die Amme", city: "Berlin", img: "https://placehold.co/400x400/blue/white?text=Die+Amme" },
            { name: "Magic Show", city: "Utrecht", img: "https://placehold.co/400x400/blue/white?text=Magic+Show" }
        ];

        const carousel = document.getElementById('carousel');
        
        // Render kaarten
        function renderCarousel() {
            carousel.innerHTML = productions.map(p => `
                <div class="min-w-[200px] text-center">
                    <img src="${p.img}" class="w-full aspect-square rounded-xl mb-4 object-cover shadow-md">
                    <h3 class="font-bold">${p.name}</h3>
                    <p class="text-sm text-gray-500">${p.city}</p>
                </div>
            `).join('');
        }

        renderCarousel();

        // Scroll functionaliteit
        document.getElementById('prevBtn').addEventListener('click', () => carousel.scrollBy(-300, 0));
        document.getElementById('nextBtn').addEventListener('click', () => carousel.scrollBy(300, 0));
    </script>
</body>
</html>
