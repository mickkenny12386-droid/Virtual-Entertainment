<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Wicked Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --stage-blue: #002347; /* Dieper, eleganter blauw */
            --accent-blue: #00a3e0;
            --white: #ffffff;
            --glass-bg: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: var(--white); overflow-x: hidden; }

        /* --- VIDEO ACHTERGROND --- */
        .video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .video-container iframe {
            width: 100vw; height: 56.25vw; /* 16:9 ratio */
            min-height: 100vh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: brightness(0.5) contrast(1.1);
        }

        /* --- NAVIGATIE --- */
        nav {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            position: fixed;
            width: 100%;
            top: 0; z-index: 1000;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; text-transform: uppercase; letter-spacing: 3px; }
        .nav-menu { display: flex; gap: 25px; list-style: none; font-size: 13px; font-weight: bold; }
        .nav-menu li { cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .nav-menu li:hover { color: var(--accent-blue); }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }

        /* --- HERO --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 20px; font-weight: 700; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .hero-btns { display: flex; gap: 20px; }
        .btn-white { background: white; color: black; padding: 18px 40px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; border-radius: 2px; }
        .btn-outline { background: transparent; color: white; border: 2px solid white; padding: 16px 38px; font-weight: bold; cursor: pointer; font-size: 15px; border-radius: 2px; }

        /* --- ZAAL MODAL (VERBETERDE STOELEN) --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { 
            background: #050505; 
            width: 90%; max-width: 900px; 
            padding: 50px; 
            border: 1px solid rgba(0,163,224,0.3); 
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        
        .stage-view { 
            width: 70%; height: 20px; 
            background: linear-gradient(to bottom, #333, #111); 
            margin: 0 auto 60px; 
            border-bottom: 3px solid var(--accent-blue); 
            text-align: center; font-size: 11px; letter-spacing: 8px; color: #777;
        }
        
        .seating-layout { display: flex; justify-content: center; gap: 40px; }
        .section { display: flex; flex-direction: column; gap: 3px; }
        .row { display: flex; gap: 3px; }
        
        /* Stoelen staan nu veel dichter bij elkaar */
        .seat { 
            width: 14px; height: 16px; 
            background: #220000; 
            border-radius: 2px 2px 4px 4px; 
            cursor: pointer; 
            transition: 0.1s;
        }
        .seat:hover { background: var(--accent-blue); transform: scale(1.2); }
        .seat.selected { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }

        /* --- ADMIN PANEEL --- */
        #admin-panel { display: none; background: rgba(0,0,0,0.9); padding: 30px; position: fixed; top: 80px; left: 5%; right: 5%; z-index: 1100; border: 1px solid var(--accent-blue); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #111; border: 1px solid #333; color: white; }

        .main-content { padding: 80px 5%; position: relative; }
        .show-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/CxYN6nSSkVs?autoplay=1&mute=1&loop=1&playlist=CxYN6nSSkVs&controls=0&showinfo=0&rel=0" frameborder="0"></iframe>
    </div>

    <nav>
        <div class="logo">Stage</div>
        <ul class="nav-menu">
            <li>Shows</li>
            <li>Theaters</li>
            <li>Nieuws</li>
            <li>Service</li>
        </ul>
        <div>
            <button class="beheer-btn" onclick="checkLogin()">BEHEER</button>
        </div>
    </nav>

    <header class="hero">
        <h1>Beleef de mooiste musicals</h1>
        <div class="hero-btns">
            <button class="btn-white">Tickets Bestellen</button>
            <button class="btn-outline">Bekijk de Trailer</button>
        </div>
    </header>

    <div id="admin-panel">
        <h3 style="margin-bottom:15px;">Nieuwe Show Toevoegen</h3>
        <input type="text" id="s-name" placeholder="Naam Musical">
        <input type="text" id="s-img" placeholder="Afbeelding URL">
        <input type="text" id="s-date" placeholder="Datum">
        <button class="btn-white" onclick="addShow()">Toevoegen</button>
        <button onclick="document.getElementById('admin-panel').style.display='none'" style="color:white; background:none; border:none; margin-left:10px; cursor:pointer;">Annuleren</button>
    </div>

    <section class="main-content">
        <div class="show-grid" id="main-grid"></div>
    </section>

    <div class="modal" id="seat-modal">
        <div class="modal-box">
            <h2 id="modal-title" style="text-align:center; margin-bottom:30px; font-family:'Playfair Display';">Kies uw plaatsen</h2>
            <div class="stage-view">PODIUM</div>
            
            <div class="seating-layout">
                <div class="section" id="left"></div>
                <div class="section" id="center"></div>
                <div class="section" id="right"></div>
            </div>

            <div style="margin-top: 50px; text-align: center;">
                <button class="btn-white" onclick="closeModal()">Tickets Bevestigen</button>
            </div>
        </div>
    </div>

    <script>
        let shows = JSON.parse(localStorage.getItem('stage_wicked_shows')) || [];
        
        function checkLogin() {
            const p = prompt("Wachtwoord:");
            if(p === "VirtualEntertainment2025!") {
                document.getElementById('admin-panel').style.display = 'block';
            }
        }

        function addShow() {
            const name = document.getElementById('s-name').value;
            const img = document.getElementById('s-img').value;
            const date = document.getElementById('s-date').value;
            shows.push({ id: Date.now(), name, img, date });
            localStorage.setItem('stage_wicked_shows', JSON.stringify(shows));
            render();
            document.getElementById('admin-panel').style.display = 'none';
        }

        function render() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            shows.forEach(s => {
                grid.innerHTML += `
                    <div style="background:rgba(0,0,0,0.8); border:1px solid #222; border-radius:4px; overflow:hidden;">
                        <img src="${s.img}" style="width:100%; height:350px; object-fit:cover;">
                        <div style="padding:20px;">
                            <h3 style="font-size:22px; color:var(--accent-blue);">${s.name}</h3>
                            <p style="margin:10px 0; font-size:14px; opacity:0.7;">${s.date}</p>
                            <button class="btn-white" style="width:100%; padding:10px;" onclick="openSeats('${s.name}')">Zaal Bekijken</button>
                        </div>
                    </div>
                `;
            });
        }

        function openSeats(name) {
            document.getElementById('modal-title').innerText = name;
            gen('left', 4, 12);
            gen('center', 12, 12);
            gen('right', 4, 12);
            document.getElementById('seat-modal').style.display = 'flex';
        }

        function gen(id, cols, rows) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            for(let r=0; r<rows; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                for(let c=0; c<cols; c++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.onclick = function() { this.classList.toggle('selected'); };
                    row.appendChild(seat);
                }
                el.appendChild(row);
            }
        }

        function closeModal() { document.getElementById('seat-modal').style.display = 'none'; }
        render();
    </script>
</body>
</html>
