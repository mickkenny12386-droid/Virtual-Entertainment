<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Professional Live System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --stage-blue: #002347; --accent-blue: #00a3e0;
            --seat-free: #333; --seat-selected: #28a745; --seat-occupied: #111;
            --sold-out: #d00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; filter: brightness(0.25); }
        .video-bg iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        nav { background: rgba(0,0,0,0.9); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; cursor: pointer; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 11px; font-weight: 700; color: #ddd; }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 8px 18px; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; }

        .page { display: none; padding: 130px 5% 50px; min-height: 100vh; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }
        .card { position: relative; height: 450px; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: #0a0a0a; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info-overlay { position: absolute; inset: 0; background: rgba(0, 35, 71, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; opacity: 0; transition: 0.4s; backdrop-filter: blur(8px); }
        .card:hover .card-info-overlay { opacity: 1; }

        .date-item { background:#111; padding:20px; margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-radius:8px; }
        .sold-out-tag { color: var(--sold-out); font-weight: bold; font-size: 12px; }

        .admin-box { max-width: 1000px; margin: 0 auto; background: #0a0a0a; padding: 40px; border-radius: 12px; border: 1px solid #333; }
        .btn-gold { background: #c5a059; color: #000; padding: 12px; border: none; font-weight: 700; cursor: pointer; width: 100%; border-radius: 4px; text-transform: uppercase; margin-top: 5px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; }
        
        .manage-item { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; margin-bottom: 5px; border-radius: 4px; border-left: 3px solid var(--accent-blue); font-size: 13px; }
        .del-btn { background: #d00; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 10px; }
    </style>
</head>
<body>

    <div class="video-bg">
        <iframe src="https://www.youtube.com/embed/CxYN6nSSkVs?autoplay=1&mute=1&loop=1&playlist=CxYN6nSSkVs&controls=0" frameborder="0"></iframe>
    </div>

    <nav>
        <div class="logo" onclick="showPage('home')">STAGE</div>
        <div class="nav-links">
            <span class="nav-link" onclick="showPage('home')">Shows</span>
            <span class="nav-link" onclick="showPage('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="showPage('news-page')">News</span>
            <span class="nav-link" onclick="showPage('account')">Account</span>
            <button class="beheer-btn" onclick="showPage('login-page')">BEHEER</button>
        </div>
    </nav>

    <section id="home" class="page active">
        <h1 style="text-align:center; margin-bottom:40px;">Productions</h1>
        <div class="grid" id="shows-cont"></div>
    </section>

    <section id="theaters-page" class="page">
        <h1>Onze Locaties</h1>
        <div style="margin-bottom:40px; border-radius:12px; overflow:hidden; border:1px solid #333;">
            <iframe width="100%" height="450" src="https://www.youtube.com/embed/msYcybnScms" frameborder="0"></iframe>
        </div>
        <div class="grid" id="th-cont"></div>
    </section>

    <section id="news-page" class="page"><h1>Laatste Nieuws</h1><div class="grid" id="news-cont"></div></section>
    
    <section id="account" class="page"><h1>Mijn Tickets</h1><div id="ticket-cont"></div></section>

    <section id="login-page" class="page">
        <div class="admin-box" style="max-width:350px; text-align:center;">
            <h2>Admin Login</h2>
            <input type="password" id="admin-pass">
            <button class="btn-gold" onclick="checkAdmin()">Login</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div class="admin-box">
            <h2>Systeem Beheer</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
                <div>
                    <h3 style="color:var(--accent-blue)">Voeg Content Toe</h3>
                    <div style="background:#111; padding:15px; border-radius:8px; margin-bottom:20px;">
                        <h4>Nieuwe Show</h4>
                        <input type="text" id="adm-name" placeholder="Show Naam">
                        <input type="text" id="adm-img" placeholder="Poster URL">
                        <textarea id="adm-info" placeholder="Omschrijving"></textarea>
                        <input type="text" id="adm-dates" placeholder="Data (bijv: 10 Feb, 12 Feb)">
                        <button class="btn-gold" onclick="saveData('shows')">Show Publiceren</button>
                    </div>
                    <div style="background:#111; padding:15px; border-radius:8px; margin-bottom:20px;">
                        <h4>Nieuw Theater</h4>
                        <input type="text" id="adm-th-name" placeholder="Theater Naam">
                        <button class="btn-gold" onclick="saveData('theaters')">Theater Opslaan</button>
                    </div>
                    <div style="background:#111; padding:15px; border-radius:8px;">
                        <h4>Nieuws Posten</h4>
                        <textarea id="adm-news" placeholder="Bericht..."></textarea>
                        <button class="btn-gold" onclick="saveData('news')">Nieuws Posten</button>
                    </div>
                </div>
                <div>
                    <h3 style="color:#d00">Beheer & Verwijder</h3>
                    <div id="manage-list"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="calendar-page" class="page"><h2 id="cal-head"></h2><div id="cal-list" style="margin-top:30px;"></div></section>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS8qIsJTEznHjCOjaP_XzsFzvIryoes18",
            authDomain: "vrtrtr-b9978.firebaseapp.com",
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vrtrtr-b9978",
            storageBucket: "vrtrtr-b9978.appspot.com",
        };
        
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const TOTAL_SEATS = 98;

        let state = { shows: [], theaters: [], news: [], bookings: {} };

        rtdb.ref('/').on('value', (snap) => {
            const data = snap.val() || {};
            state.shows = data.shows ? Object.values(data.shows) : [];
            state.theaters = data.theaters ? Object.values(data.theaters) : [];
            state.news = data.news ? Object.values(data.news) : [];
            state.bookings = data.bookings || {};
            renderAll();
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveData(type) {
            const id = Date.now();
            let payload = { id };
            if(type === 'shows') {
                payload.name = document.getElementById('adm-name').value;
                payload.img = document.getElementById('adm-img').value;
                payload.info = document.getElementById('adm-info').value;
                payload.dates = document.getElementById('adm-dates').value.split(',').map(d => d.trim());
            } else if(type === 'theaters') {
                payload.name = document.getElementById('adm-th-name').value;
            } else {
                payload.text = document.getElementById('adm-news').value;
                payload.date = new Date().toLocaleDateString();
            }
            rtdb.ref(type + '/' + id).set(payload).then(() => alert("Succesvol toegevoegd!"));
        }

        function deleteItem(type, id) {
            if(confirm("Weet je het zeker?")) {
                rtdb.ref(type + '/' + id).remove();
            }
        }

        function renderAll() {
            // Shows
            document.getElementById('shows-cont').innerHTML = state.shows.map(s => `
                <div class="card" onclick="openCal(${s.id})">
                    <img src="${s.img}"><div class="card-info-overlay"><h3>${s.name}</h3><p>Tickets</p></div>
                </div>`).join('');

            // Theaters
            document.getElementById('th-cont').innerHTML = state.theaters.map(t => `
                <div class="card" style="padding:20px; height:auto;"><h3>${t.name}</h3></div>`).join('');

            // News
            document.getElementById('news-cont').innerHTML = state.news.map(n => `
                <div class="card" style="padding:20px; height:auto;"><small>${n.date}</small><p>${n.text}</p></div>`).join('');

            // Admin Beheer Lijst
            let html = "<h4>Shows</h4>";
            state.shows.forEach(s => html += `<div class="manage-item">${s.name} <button class="del-btn" onclick="deleteItem('shows', ${s.id})">X</button></div>`);
            html += "<h4 style='margin-top:15px'>Theaters</h4>";
            state.theaters.forEach(t => html += `<div class="manage-item">${t.name} <button class="del-btn" onclick="deleteItem('theaters', ${t.id})">X</button></div>`);
            html += "<h4 style='margin-top:15px'>Nieuws</h4>";
            state.news.forEach(n => html += `<div class="manage-item">${n.text.substring(0,20)}... <button class="del-btn" onclick="deleteItem('news', ${n.id})">X</button></div>`);
            document.getElementById('manage-list').innerHTML = html;
        }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === "VirtualEntertainment2025!") showPage('admin-dashboard');
        }

        // Andere functies (openCal, openSeats, book) blijven hetzelfde als voorheen...
        showPage('home');
    </script>
</body>
</html>
