<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Virtual Entertainment | Pro Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --blue: #0044ff; --bg: rgba(0,0,0,0.85); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: url('https://eu-central-1-dotcontrol.graphassets.com/ARqeS7pzaQfsqxPd1pwy9z/MNy8cZEdQPa3MoUePRSi') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            overflow-x: hidden;
        }

        /* Container die alles blurret bij focus */
        .page-content {
            min-height: 100vh;
            padding-top: 80px;
            background: rgba(0,0,0,0.6);
            transition: 0.5s ease;
        }

        /* Blur effect als er over een kaart gehoverd wordt */
        body:has(.card:hover) .page-content {
            backdrop-filter: blur(15px);
            background: rgba(0,0,0,0.8);
        }

        nav { 
            background: #000; height: 70px; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 5%; 
            position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--blue); 
        }
        .nav-link { cursor: pointer; text-transform: uppercase; font-weight: 700; margin-left: 20px; font-size: 12px; }

        .section { padding: 40px 5%; display: none; }
        .section.active { display: block; }

        /* MUSICAL CARDS MET INFO OVERLAY */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        
        .card { 
            background: #000; border-radius: 12px; overflow: hidden; position: relative; 
            height: 480px; border: 1px solid #333; transition: 0.3s;
        }

        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }

        /* De uitklapbare tab met informatie */
        .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0;
            background: linear-gradient(transparent, #000 30%, #000);
            overflow: hidden; transition: 0.5s ease;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 0 20px;
        }

        .card:hover .card-info { height: 100%; padding-bottom: 40px; }
        .card:hover img { transform: scale(1.1); filter: brightness(0.4); }

        .ticket-link { 
            color: var(--blue); font-weight: bold; text-decoration: underline; 
            cursor: pointer; margin-top: 15px; display: inline-block;
        }

        /* NIEUWS STYLING */
        .news-item { background: rgba(255,255,255,0.05); padding: 25px; border-left: 4px solid var(--blue); margin-bottom: 20px; border-radius: 8px; }
        .news-date { font-size: 11px; color: var(--blue); font-weight: bold; text-transform: uppercase; }

        /* UI BUTTONS & MODALS */
        .btn { background: var(--blue); color: #fff; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .ticket-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; }
    </style>
</head>
<body>

<div class="page-content">
    <nav>
        <div onclick="showPage('home')" style="cursor:pointer; font-weight:800; color:var(--blue); font-size: 18px;">VIRTUAL ENT.</div>
        <div>
            <span class="nav-link" onclick="showPage('home')">Shows</span>
            <span class="nav-link" onclick="showPage('news-tab')">Nieuws</span>
            <span class="nav-link" onclick="showPage('explore')">Theaters</span>
            <span class="nav-link" onclick="showPage('account')">My Account</span>
            <span class="nav-link" onclick="showPage('admin-login')" style="opacity: 0.5;">Admin</span>
        </div>
    </nav>

    <section id="home" class="section active">
        <h2>Nu in de theaters</h2><br>
        <div id="show-list" class="grid"></div>
    </section>

    <section id="news-tab" class="section">
        <h2>Laatste Nieuws</h2><br>
        <div id="news-list"></div>
    </section>

    <section id="explore" class="section">
        <h2>Onze Locaties</h2><br>
        <div id="theater-list" class="grid"></div>
    </section>

    <section id="account" class="section">
        <h2>Mijn Reserveringen</h2><br>
        <div id="ticket-list" style="max-width: 600px;"></div>
    </section>

    <section id="admin-panel" class="section">
        <div style="background:rgba(0,0,0,0.9); padding:30px; border-radius:12px; border: 1px solid var(--blue);">
            <h2>Management Console</h2><br>
            <select id="obj-type">
                <option value="shows">Nieuwe Musical</option>
                <option value="news">Nieuwsbericht Plaatsen</option>
                <option value="theaters">Theater Toevoegen</option>
            </select>
            <input type="text" id="obj-name" placeholder="Naam / Titel">
            <input type="text" id="obj-img" placeholder="Afbeelding URL">
            <textarea id="obj-info" placeholder="Beschrijving / Informatie" rows="4"></textarea>
            <input type="text" id="obj-dates" placeholder="Beschikbare datums (komma gescheiden)">
            <button class="btn" style="width:100%" onclick="saveObject()">Gooi online</button>
            <hr style="margin:20px 0; border:0; border-top:1px solid #333;">
            <div id="admin-stats"></div>
        </div>
    </section>

    <section id="admin-login" class="section">
        <div style="max-width:300px; margin:auto; text-align:center;">
            <input type="password" id="adm-pass" placeholder="Admin Wachtwoord">
            <button class="btn" onclick="checkLogin()">Inloggen</button>
        </div>
    </section>
</div>

<div id="ticket-modal" class="ticket-modal">
    <div style="background:#111; padding:40px; border-radius:15px; border:1px solid var(--blue); width:400px;">
        <h2 id="m-title"></h2><br>
        <select id="m-date-select"></select>
        <p style="font-size:12px; margin-bottom:10px;">Rang I (Beschikbaar: 28)</p>
        <input type="number" id="qty-r1" value="0" min="0">
        <p style="font-size:12px; margin-bottom:10px;">Rang II (Beschikbaar: 28)</p>
        <input type="number" id="qty-r2" value="0" min="0">
        <p style="font-size:12px; margin-bottom:10px;">Rang III (Beschikbaar: 42)</p>
        <input type="number" id="qty-r3" value="0" min="0">
        <button class="btn" style="width:100%" onclick="processPurchase()">Bestelling afronden</button>
        <button class="btn" style="width:100%; background:#333; margin-top:10px;" onclick="closeModal()">Terug</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentShow = null;
    const sessionID = "User_" + Math.floor(Math.random() * 9999);

    function showPage(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    // REAL-TIME DATA SYNC
    db.ref('/').on('value', snap => {
        const d = snap.val() || {};
        renderShows(d.shows);
        renderNews(d.news);
        renderTheaters(d.theaters);
        renderAdminStats(d.shows, d.sales);
    });

    function renderShows(shows) {
        const c = document.getElementById('show-list'); c.innerHTML = "";
        if(!shows) return;
        Object.values(shows).forEach(s => {
            if(s.status === "offline") return;
            c.innerHTML += `
                <div class="card">
                    <img src="${s.img}">
                    <div class="card-info">
                        <h3>${s.name}</h3>
                        <p style="font-size:13px; color:#ccc; margin-top:10px;">${s.info.substring(0, 150)}...</p>
                        <span class="ticket-link" onclick="openTickets('${s.id}')">Click here for tickets</span>
                    </div>
                </div>`;
        });
    }

    function renderNews(news) {
        const c = document.getElementById('news-list'); c.innerHTML = "";
        if(!news) return;
        Object.values(news).reverse().forEach(n => {
            c.innerHTML += `
                <div class="news-item">
                    <div class="news-date">Gepost op: ${n.posted || 'Recent'}</div>
                    <h3 style="margin:5px 0;">${n.name}</h3>
                    <p>${n.info}</p>
                </div>`;
        });
    }

    function openTickets(id) {
        db.ref('shows/'+id).once('value', s => {
            currentShow = s.val();
            document.getElementById('m-title').innerText = currentShow.name;
            const ds = document.getElementById('m-date-select'); ds.innerHTML = "";
            currentShow.dates.split(',').forEach(d => ds.innerHTML += `<option>${d.trim()}</option>`);
            document.getElementById('ticket-modal').style.display = 'flex';
        });
    }

    function processPurchase() {
        const q1 = parseInt(document.getElementById('qty-r1').value);
        const q2 = parseInt(document.getElementById('qty-r2').value);
        const q3 = parseInt(document.getElementById('qty-r3').value);

        db.ref('sales/'+currentShow.id).transaction(cur => {
            cur = cur || {r1:0, r2:0, r3:0};
            if((cur.r1+q1)>28 || (cur.r2+q2)>28 || (cur.r3+q3)>42) return;
            cur.r1 += q1; cur.r2 += q2; cur.r3 += q3;
            return cur;
        }).then(() => {
            db.ref('bookings/'+sessionID+'/'+Date.now()).set({
                show: currentShow.name,
                tickets: `Rang I: ${q1}, Rang II: ${q2}, Rang III: ${q3}`,
                date: document.getElementById('m-date-select').value
            });
            alert("Reservering gelukt! Bekijk 'My Account'.");
            closeModal();
            loadAccount();
        });
    }

    function loadAccount() {
        db.ref('bookings/'+sessionID).once('value', snap => {
            const b = snap.val();
            const c = document.getElementById('ticket-list');
            c.innerHTML = b ? Object.values(b).map(t => `
                <div class="news-item" style="border-left-color: #0f0;">
                    <b style="font-size:18px;">${t.show}</b><br>
                    <span>Datum: ${t.date}</span><br>
                    <small>${t.tickets}</small>
                </div>`).join('') : "Nog geen reserveringen.";
        });
    }

    // ADMIN TOOLS
    function checkLogin() {
        if(document.getElementById('adm-pass').value === "Virtual2025") showPage('admin-panel');
        else alert("Toegang geweigerd");
    }

    function saveObject() {
        const type = document.getElementById('obj-type').value;
        const id = Date.now();
        const now = new Date();
        const dateStr = now.toLocaleDateString('nl-NL') + " " + now.toLocaleTimeString('nl-NL', {hour: '2-digit', minute:'2-digit'});
        
        db.ref(type+'/'+id).set({
            id, name: document.getElementById('obj-name').value,
            img: document.getElementById('obj-img').value,
            info: document.getElementById('obj-info').value,
            dates: document.getElementById('obj-dates').value || "",
            posted: dateStr,
            status: "online"
        }).then(() => { alert("Item is live!"); });
    }

    function renderAdminStats(shows, sales) {
        const c = document.getElementById('admin-stats'); c.innerHTML = "<h3>Verkoopcijfers</h3><br>";
        if(!shows) return;
        Object.values(shows).forEach(s => {
            const sale = sales ? sales[s.id] || {r1:0, r2:0, r3:0} : {r1:0, r2:0, r3:0};
            c.innerHTML += `<div style="font-size:12px; margin-bottom:10px;">
                <b>${s.name}</b> [${s.status}]<br>
                R1: ${sale.r1}/28 | R2: ${sale.r2}/28 | R3: ${sale.r3}/42
            </div>`;
        });
    }

    function renderTheaters(th) {
        const c = document.getElementById('theater-list'); c.innerHTML = "";
        if(th) Object.values(th).forEach(t => {
            c.innerHTML += `<div class="card" style="height:300px;"><img src="${t.img}"><div class="card-info"><h3>${t.name}</h3><p style="font-size:12px;">${t.info}</p></div></div>`;
        });
    }

    function closeModal() { document.getElementById('ticket-modal').style.display = 'none'; }
    loadAccount();
</script>
</body>
</html>
