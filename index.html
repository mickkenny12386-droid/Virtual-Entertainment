<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Entertainment | Complete System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --main-blue: #0044ff;
            --seat-free: #0055ff;
            --seat-selected: #00ff00;
            --seat-occupied: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            /* Achtergrond die perfect mee-stretcht */
            background: url('https://images.alphacoders.com/134/1343715.png') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            min-height: 100vh;
        }

        .page-overlay {
            background: rgba(0, 0, 0, 0.75);
            min-height: 100vh;
            width: 100%;
            padding-top: 90px;
        }

        nav { 
            background: rgba(0,0,0,0.95); height: 70px; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 5%; 
            position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--main-blue); 
        }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: 700; color: #fff; margin-left: 20px; transition: 0.3s; }
        .nav-link:hover { color: var(--main-blue); }

        .section { padding: 40px 5%; display: none; }
        .section.active { display: block; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid #444; cursor: pointer; overflow: hidden; transition: 0.3s; }
        .card:hover { border-color: var(--main-blue); transform: translateY(-5px); }
        .card img { width: 100%; height: 300px; object-fit: cover; }

        /* SEATING OVERLAY FIX */
        #seating-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .theater-layout {
            display: grid;
            grid-template-columns: repeat(3, 25px) 30px repeat(8, 25px) 30px repeat(3, 25px);
            gap: 8px; padding: 30px; background: #0a0a0a; border: 2px solid var(--main-blue); border-radius: 15px;
        }
        .seat-btn { width: 25px; height: 25px; background: var(--seat-free); border: none; border-radius: 4px; cursor: pointer; }
        .seat-btn.selected { background: var(--seat-selected); box-shadow: 0 0 10px var(--seat-selected); }
        .seat-btn.occupied { background: var(--seat-occupied); cursor: not-allowed; opacity: 0.3; }
        .gap { width: 30px; }

        /* UI ELEMENTS */
        .btn-action { background: var(--main-blue); color: #fff; padding: 15px 30px; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; margin: 10px 5px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 5px; }
        .admin-box { max-width: 600px; margin: auto; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 10px; border: 1px solid var(--main-blue); }
        .news-item { background: rgba(255,255,255,0.05); padding: 20px; border-left: 4px solid var(--main-blue); margin-bottom: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="page-overlay">
    <nav>
        <div class="logo" onclick="showSec('home')">VIRTUAL ENTERTAINMENT</div>
        <div>
            <span class="nav-link" onclick="showSec('home')">Musicals</span>
            <span class="nav-link" onclick="showSec('explore')">Explore & News</span>
            <span class="nav-link" onclick="showSec('tickets')">My Tickets</span>
            <span class="nav-link" onclick="showSec('login')" style="color:var(--main-blue)">Admin</span>
        </div>
    </nav>

    <section id="home" class="section active">
        <h2>Now Playing</h2><br>
        <div id="shows-list" class="grid"></div>
    </section>

    <section id="explore" class="section">
        <h2>Our Theaters</h2><br>
        <div id="theaters-list" class="grid"></div><br><br>
        <h2>Latest News</h2><br>
        <div id="news-list"></div>
    </section>

    <section id="tickets" class="section">
        <h2>My Reservations</h2><br>
        <div id="tickets-list"></div>
    </section>

    <section id="login" class="section">
        <div style="max-width:300px; margin:auto; text-align:center;">
            <h3>Admin Login</h3><br>
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-action" onclick="doLogin()">Login</button>
        </div>
    </section>

    <section id="admin-p" class="section">
        <div class="admin-box">
            <h2>Management Panel</h2><br>
            <label>Add Item To:</label>
            <select id="adm-type">
                <option value="shows">Musicals</option>
                <option value="theaters">Theaters</option>
                <option value="news">News</option>
            </select>
            <input type="text" id="adm-name" placeholder="Title/Name">
            <input type="text" id="adm-img" placeholder="Image URL (Posters/Photos)">
            <textarea id="adm-info" placeholder="Extra Info / Description" rows="4"></textarea>
            <button class="btn-action" style="width:100%" onclick="saveAdminData()">Save & Publish</button>
        </div>
    </section>
</div>

<div id="seating-screen">
    <h1 id="s-title">Musical Title</h1><br>
    <div class="theater-layout" id="seat-grid"></div>
    <div style="margin-top:30px;">
        <button class="btn-action" onclick="confirmSeats()">Confirm Seats</button>
        <button class="btn-action" style="background:#444;" onclick="closeSeating()">Back</button>
    </div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = { databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let curShowId = null;
    let picked = [];
    const userId = "User_" + Math.floor(Math.random() * 9999);

    function showSec(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        closeSeating();
    }

    // Data Laden
    db.ref('/').on('value', snap => {
        const data = snap.val() || {};
        
        // Musicals
        const sCont = document.getElementById('shows-list');
        sCont.innerHTML = "";
        if(data.shows) Object.values(data.shows).forEach(s => {
            sCont.innerHTML += `<div class="card" onclick="openSeats('${s.id}', '${s.name}')"><img src="${s.img}"><div style="padding:15px;"><h3>${s.name}</h3></div></div>`;
        });

        // Theaters
        const tCont = document.getElementById('theaters-list');
        tCont.innerHTML = "";
        if(data.theaters) Object.values(data.theaters).forEach(t => {
            tCont.innerHTML += `<div class="card"><img src="${t.img}"><div style="padding:15px;"><h3>${t.name}</h3><small>${t.info}</small></div></div>`;
        });

        // Nieuws
        const nCont = document.getElementById('news-list');
        nCont.innerHTML = data.news ? Object.values(data.news).map(n => `<div class="news-item"><h3>${n.name}</h3><p>${n.info}</p></div>`).join('') : "No news yet.";
    });

    // Seating Functies
    function openSeats(id, name) {
        curShowId = id; picked = [];
        document.getElementById('s-title').innerText = name;
        document.getElementById('seating-screen').style.display = 'flex';
        
        db.ref('seats/'+id).on('value', snap => {
            const taken = snap.val() || {};
            const grid = document.getElementById('seat-grid');
            grid.innerHTML = "";
            for(let r=1; r<=8; r++) {
                for(let s=1; s<=3; s++) createBtn(grid, `L-R${r}-S${s}`, taken);
                grid.innerHTML += `<div class="gap"></div>`;
                for(let s=1; s<=8; s++) createBtn(grid, `C-R${r}-S${s}`, taken);
                grid.innerHTML += `<div class="gap"></div>`;
                for(let s=1; s<=3; s++) createBtn(grid, `R-R${r}-S${s}`, taken);
            }
        });
    }

    function createBtn(parent, sid, taken) {
        const b = document.createElement('button');
        b.className = "seat-btn " + (taken[sid] ? "occupied" : "");
        if(!taken[sid]) {
            b.onclick = (e) => {
                e.stopPropagation();
                b.classList.toggle('selected');
                if(picked.includes(sid)) picked = picked.filter(x => x !== sid);
                else picked.push(sid);
            }
        }
        parent.appendChild(b);
    }

    function confirmSeats() {
        if(picked.length === 0) return alert("Please select your seats!");
        picked.forEach(s => db.ref('seats/'+curShowId+'/'+s).set(true));
        db.ref('users/'+userId+'/'+Date.now()).set({ show: document.getElementById('s-title').innerText, seats: picked.join(', '), date: new Date().toLocaleString() });
        alert("Booking Confirmed!"); closeSeating(); loadMyTickets();
    }

    function closeSeating() { document.getElementById('seating-screen').style.display = 'none'; }

    // Admin Functies
    function doLogin() {
        if(document.getElementById('pass').value === "Virtual2025") showSec('admin-p');
        else alert("Access Denied");
    }

    function saveAdminData() {
        const type = document.getElementById('adm-type').value;
        const id = Date.now();
        db.ref(type+'/'+id).set({
            id,
            name: document.getElementById('adm-name').value,
            img: document.getElementById('adm-img').value,
            info: document.getElementById('adm-info').value
        }).then(() => {
            alert("Published Successfully!");
            document.querySelectorAll('input, textarea').forEach(i => i.value = "");
        });
    }

    function loadMyTickets() {
        db.ref('users/'+userId).once('value', snap => {
            const d = snap.val();
            document.getElementById('tickets-list').innerHTML = d ? Object.values(d).map(t => `<div class="news-item"><b>${t.show}</b><br>Seats: ${t.seats}<br><small>${t.date}</small></div>`).join('') : "No tickets booked.";
        });
    }

    loadMyTickets();
</script>
</body>
</html>
