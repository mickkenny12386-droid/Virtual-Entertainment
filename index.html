<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Professional System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --stage-blue: #002347;
            --accent-blue: #00a3e0;
            --white: #ffffff;
            --seat-free: #333;
            --seat-selected: #28a745; 
            --seat-occupied: #111;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; filter: brightness(0.3); }
        .video-bg iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        nav { background: rgba(0,0,0,0.9); height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid #222; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; cursor: pointer; }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: bold; margin-left: 20px; }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }

        .page { display: none; padding: 120px 5% 50px; min-height: 100vh; }
        .page.active { display: block; }

        /* Login Scherm */
        .login-box { max-width: 400px; margin: 100px auto; background: rgba(20,20,20,0.95); padding: 40px; border-radius: 8px; border: 1px solid var(--accent-blue); text-align: center; }
        
        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: rgba(20,20,20,0.9); border: 1px solid #333; border-radius: 8px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .card-info { padding: 20px; }

        /* Seating Chart */
        .seating-wrapper { display: flex; justify-content: center; gap: 40px; margin: 40px auto; padding: 30px; background: #050505; border-radius: 10px; width: fit-content; }
        .row { display: flex; gap: 6px; margin-bottom: 6px; }
        .seat { width: 22px; height: 25px; background: var(--seat-free); border-radius: 4px 4px 8px 8px; cursor: pointer; }
        .seat.selected { background: var(--seat-selected); box-shadow: 0 0 10px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied); cursor: not-allowed; opacity: 0.3; }

        /* Forms */
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 4px; }
        .btn-action { background: var(--white); color: #000; padding: 15px; border: none; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="video-bg">
        <iframe src="https://www.youtube.com/embed/CxYN6nSSkVs?autoplay=1&mute=1&loop=1&playlist=CxYN6nSSkVs&controls=0" frameborder="0"></iframe>
    </div>

    <nav>
        <div class="logo" onclick="showPage('home')">STAGE</div>
        <div>
            <span class="nav-link" onclick="showPage('home')">Shows</span>
            <span class="nav-link" onclick="showPage('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="showPage('news-page')">Nieuws</span>
            <span class="nav-link" onclick="showPage('account')">👤 My Account</span>
            <button class="beheer-btn" onclick="showPage('login-page')" style="margin-left:20px;">BEHEER</button>
        </div>
    </nav>

    <section id="login-page" class="page">
        <div class="login-box">
            <h2>Beheer Inloggen</h2>
            <input type="password" id="admin-pass" placeholder="Wachtwoord">
            <button class="btn-action" onclick="checkAdmin()">Inloggen</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div style="max-width: 800px; margin: 0 auto; background: #111; padding: 30px; border-radius: 8px;">
            <h2>Beheer Paneel</h2>
            <hr style="margin: 20px 0; opacity: 0.2;">
            
            <h3>Nieuwe Show Toevoegen</h3>
            <input type="text" id="adm-name" placeholder="Naam van de musical">
            <input type="text" id="adm-img" placeholder="Link naar PNG/JPG poster">
            <textarea id="adm-dates" placeholder="Tijden (gescheiden door komma, bijv: 10 Feb 20:00, 12 Feb 14:00)"></textarea>
            <button class="btn-action" onclick="addShow()">Show Publiceren</button>

            <h3 style="margin-top:30px;">Theater Toevoegen</h3>
            <input type="text" id="adm-th-name" placeholder="Naam Theater">
            <button class="btn-action" onclick="addTheater()">Theater Opslaan</button>

            <h3 style="margin-top:30px;">Nieuws Posten</h3>
            <textarea id="adm-news" placeholder="Bericht..."></textarea>
            <button class="btn-action" onclick="addNews()">Bericht Posten</button>
            
            <button onclick="showPage('home')" style="margin-top:20px; color: gray; background:none; border:none; cursor:pointer;">Uitloggen</button>
        </div>
    </section>

    <section id="home" class="page active"><div class="grid" id="shows-cont"></div></section>
    <section id="theaters-page" class="page"><div class="grid" id="th-cont"></div></section>
    <section id="news-page" class="page"><div class="grid" id="news-cont"></div></section>
    <section id="account" class="page"><h2>Mijn Tickets</h2><div id="ticket-cont" style="margin-top:20px;"></div></section>

    <section id="calendar-page" class="page"><h2 id="cal-head"></h2><div id="cal-list" style="margin-top:20px;"></div></section>
    <section id="seating-page" class="page">
        <h2 id="seat-head" style="text-align:center;"></h2>
        <div style="width:400px; height:2px; background:var(--accent-blue); margin: 40px auto; box-shadow: 0 0 10px var(--accent-blue);"></div>
        <div class="seating-wrapper">
            <div id="l-wing" class="section"></div>
            <div id="c-pit" class="section"></div>
            <div id="r-wing" class="section"></div>
        </div>
        <button class="btn-action" style="max-width:300px; margin: 20px auto; display:block;" onclick="book()">Bestellen</button>
    </section>

    <script>
        let db = {
            shows: JSON.parse(localStorage.getItem('st_shows')) || [],
            theaters: JSON.parse(localStorage.getItem('st_theaters')) || [],
            news: JSON.parse(localStorage.getItem('st_news')) || [],
            bookings: JSON.parse(localStorage.getItem('st_bookings')) || []
        };

        let cur = { show: null, date: null, selected: [] };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'home') renderHome();
            if(id === 'theaters-page') renderTheaters();
            if(id === 'news-page') renderNews();
            if(id === 'account') renderAccount();
        }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === "VirtualEntertainment2025!") showPage('admin-dashboard');
            else alert("Fout!");
        }

        function addShow() {
            const name = document.getElementById('adm-name').value;
            const img = document.getElementById('adm-img').value;
            const dates = document.getElementById('adm-dates').value.split(',').map(d => d.trim());
            db.shows.push({ id: Date.now(), name, img, dates });
            save(); alert("Show staat online!");
        }

        function addTheater() {
            db.theaters.push({ name: document.getElementById('adm-th-name').value });
            save(); alert("Theater toegevoegd!");
        }

        function addNews() {
            db.news.push({ text: document.getElementById('adm-news').value, date: new Date().toLocaleDateString() });
            save(); alert("Nieuws gepost!");
        }

        function renderHome() {
            document.getElementById('shows-cont').innerHTML = db.shows.map(s => `
                <div class="card" onclick="openCal(${s.id})">
                    <img src="${s.img}">
                    <div class="card-info"><h3>${s.name}</h3></div>
                </div>
            `).join('');
        }

        function openCal(id) {
            cur.show = db.shows.find(s => s.id === id);
            document.getElementById('cal-head').innerText = cur.show.name;
            document.getElementById('cal-list').innerHTML = cur.show.dates.map(d => `
                <div style="background:#111; padding:20px; margin-bottom:10px; cursor:pointer;" onclick="openSeats('${d}')">${d}</div>
            `).join('');
            showPage('calendar-page');
        }

        function openSeats(date) {
            cur.date = date; cur.selected = [];
            document.getElementById('seat-head').innerText = `${cur.show.name} - ${date}`;
            const taken = db.bookings.find(b => b.sid === cur.show.id && b.date === date)?.seats || [];
            
            genSection('l-wing', 3, 7, taken, 'L');
            genSection('c-pit', 8, 7, taken, 'C');
            genSection('r-wing', 3, 7, taken, 'R');
            showPage('seating-page');
        }

        function genSection(contId, cols, rows, taken, pref) {
            const el = document.getElementById(contId); el.innerHTML = '';
            for(let r=1; r<=rows; r++) {
                const row = document.createElement('div'); row.className = 'row';
                for(let c=1; c<=cols; c++) {
                    const id = `${pref}${r}${c}`;
                    const s = document.createElement('div');
                    s.className = 'seat' + (taken.includes(id) ? ' occupied' : '');
                    s.onclick = () => { if(!s.classList.contains('occupied')) { s.classList.toggle('selected'); toggleS(id); }};
                    row.appendChild(s);
                }
                el.appendChild(row);
            }
        }

        function toggleS(id) {
            if(cur.selected.includes(id)) cur.selected = cur.selected.filter(x => x !== id);
            else cur.selected.push(id);
        }

        function book() {
            if(cur.selected.length === 0) return;
            let b = db.bookings.find(x => x.sid === cur.show.id && x.date === cur.date);
            if(b) b.seats.push(...cur.selected);
            else db.bookings.push({ sid: cur.show.id, sname: cur.show.name, date: cur.date, seats: [...cur.selected] });
            save(); alert("Gereserveerd!"); showPage('account');
        }

        function renderAccount() {
            document.getElementById('ticket-cont').innerHTML = db.bookings.map(b => `
                <div style="background:#111; padding:15px; border-left:4px solid var(--accent-blue); margin-bottom:10px;">
                    <h4>${b.sname}</h4><small>${b.date}</small><br>Stoelen: ${b.seats.join(', ')}
                </div>
            `).join('');
        }

        function renderNews() { document.getElementById('news-cont').innerHTML = db.news.map(n => `<div class="card" style="padding:20px;"><small>${n.date}</small><p>${n.text}</p></div>`).join(''); }
        function renderTheaters() { document.getElementById('th-cont').innerHTML = db.theaters.map(t => `<div class="card" style="padding:20px;"><h3>${t.name}</h3></div>`).join(''); }

        function save() { localStorage.setItem('st_shows', JSON.stringify(db.shows)); localStorage.setItem('st_theaters', JSON.stringify(db.theaters)); localStorage.setItem('st_news', JSON.stringify(db.news)); localStorage.setItem('st_bookings', JSON.stringify(db.bookings)); }
        
        showPage('home');
    </script>
</body>
</html>
