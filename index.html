<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Entertainment | Premium Theater</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #002347; /* Diepblauw zoals de screenshot rood was */
            --accent-blue: #00a3e0;
            --dark-bg: #010a14;
            --card-bg: #051629;
            --text-white: #ffffff;
            --admin-gold: #d4af37;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            line-height: 1.6;
        }

        /* --- NAVIGATIE --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--primary-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--accent-blue); text-transform: uppercase; }
        .nav-links button {
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 8px 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-links button:hover { background: var(--accent-blue); color: white; }

        /* --- HERO --- */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,35,71,0.8), var(--dark-bg)), url('https://images.unsplash.com/photo-1503095396549-807a8bc36675?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin-bottom: 20px; }

        /* --- ADMIN LOGIN --- */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .login-box { background: var(--card-bg); padding: 40px; border: 1px solid var(--accent-blue); text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #010a14; border: 1px solid #1e293b; color: white; }

        /* --- SHOWS & AGENDA --- */
        .container { padding: 50px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .card { background: var(--card-bg); border-radius: 4px; overflow: hidden; border-bottom: 4px solid var(--primary-blue); }
        .card img { width: 100%; height: 400px; object-fit: cover; }
        .card-info { padding: 20px; }
        .agenda-list { margin: 15px 0; font-size: 0.9rem; color: #cbd5e1; }

        /* --- SEATING CHART BUILDER --- */
        .seating-builder { background: #051629; padding: 20px; margin-top: 20px; border: 1px dashed var(--admin-gold); }
        .stage { width: 80%; height: 20px; background: var(--accent-blue); margin: 20px auto; text-align: center; font-size: 12px; color: black; font-weight: bold; }
        .row { display: flex; justify-content: center; margin-bottom: 5px; }
        .seat { width: 20px; height: 20px; background: #1e293b; margin: 2px; border-radius: 2px; cursor: pointer; }
        .seat.selected { background: var(--accent-blue); }

        .btn { padding: 10px 20px; cursor: pointer; border: none; font-weight: bold; text-transform: uppercase; }
        .btn-blue { background: var(--accent-blue); color: white; }
        .btn-admin { background: var(--admin-gold); color: black; margin-top: 10px; width: 100%; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Virtual <span>Entertainment</span></div>
    <div class="nav-links">
        <button id="admin-btn" onclick="toggleLogin()">Beheer</button>
        <button id="logout-btn" class="hidden" onclick="logout()">Uitloggen</button>
    </div>
</nav>

<div id="login-overlay">
    <div class="login-box">
        <h2>Admin Toegang</h2>
        <input type="text" id="user" placeholder="Gebruikersnaam">
        <input type="password" id="pass" placeholder="Wachtwoord">
        <button class="btn btn-blue" onclick="login()">Inloggen</button>
        <button onclick="toggleLogin()" style="background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Annuleren</button>
    </div>
</div>

<header class="hero">
    <h1>Beleef de mooiste shows</h1>
    <div style="display:flex; gap:20px;">
        <button class="btn btn-blue">Kies een show</button>
        <button class="btn" style="background:white; color:black;">Agenda bekijken</button>
    </div>
</header>

<div class="container admin-only hidden" id="admin-panel">
    <h2 style="color:var(--admin-gold)">Show Toevoegen</h2>
    <input type="text" id="show-title" placeholder="Naam van de show">
    <input type="text" id="show-img" placeholder="Afbeelding URL">
    <div style="display:flex; gap:10px;">
        <input type="number" id="row-count" placeholder="Aantal rijen" value="5">
        <input type="number" id="seat-count" placeholder="Stoelen per rij" value="10">
    </div>
    <button class="btn btn-admin" onclick="addShow()">Show Publiceren</button>
</div>

<div class="container">
    <h2 style="margin-bottom:30px;">Actuele Agenda</h2>
    <div class="grid" id="show-grid"></div>
</div>

<div id="seating-modal" class="modal hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; padding:50px;">
    <div style="max-width:800px; margin:auto; background:var(--card-bg); padding:30px; border:1px solid var(--accent-blue);">
        <h2 id="modal-title">Zaalindeling</h2>
        <div class="stage">PODIUM</div>
        <div id="seating-area"></div>
        <button class="btn btn-blue" style="margin-top:20px;" onclick="closeSeating()">Sluiten</button>
    </div>
</div>

<script>
    let shows = JSON.parse(localStorage.getItem('theater_shows')) || [];
    let isAdmin = false;

    function toggleLogin() {
        document.getElementById('login-overlay').style.display = 'flex';
    }

    function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === "Kenny&Jimi" && p === "VirtualEntertainment2025!") {
            isAdmin = true;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('admin-btn').classList.add('hidden');
            renderShows();
        } else {
            alert("Onjuiste gegevens");
        }
    }

    function logout() {
        isAdmin = false;
        location.reload();
    }

    function addShow() {
        const title = document.getElementById('show-title').value;
        const img = document.getElementById('show-img').value;
        const rows = document.getElementById('row-count').value;
        const seats = document.getElementById('seat-count').value;

        if(!title || !img) return alert("Vul alles in");

        shows.push({
            id: Date.now(),
            title: title,
            img: img,
            rows: rows,
            seats: seats,
            dates: ["Vrijdag 20:00", "Zaterdag 15:00", "Zaterdag 20:00"]
        });

        localStorage.setItem('theater_shows', JSON.stringify(shows));
        renderShows();
    }

    function deleteShow(id) {
        shows = shows.filter(s => s.id !== id);
        localStorage.setItem('theater_shows', JSON.stringify(shows));
        renderShows();
    }

    function renderShows() {
        const grid = document.getElementById('show-grid');
        grid.innerHTML = '';
        shows.forEach(show => {
            grid.innerHTML += `
                <div class="card">
                    <img src="${show.img}" alt="${show.title}">
                    <div class="card-info">
                        <h3>${show.title}</h3>
                        <div class="agenda-list">
                            <strong>Speeldata:</strong><br>
                            ${show.dates.map(d => `• ${d}<br>`).join('')}
                        </div>
                        <button class="btn btn-blue" style="width:100%" onclick="openSeating(${show.id})">Kies Stoelen</button>
                        ${isAdmin ? `<button class="btn btn-admin" style="background:red; color:white;" onclick="deleteShow(${show.id})">Verwijder Show</button>` : ''}
                    </div>
                </div>
            `;
        });
    }

    function openSeating(id) {
        const show = shows.find(s => s.id == id);
        const area = document.getElementById('seating-area');
        area.innerHTML = '';
        document.getElementById('modal-title').innerText = "Zaalindeling: " + show.title;

        for(let r=0; r<show.rows; r++) {
            let rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            for(let s=0; s<show.seats; s++) {
                let seatDiv = document.createElement('div');
                seatDiv.className = 'seat';
                seatDiv.onclick = function() { this.classList.toggle('selected'); };
                rowDiv.appendChild(seatDiv);
            }
            area.appendChild(rowDiv);
        }
        document.getElementById('seating-modal').classList.remove('hidden');
    }

    function closeSeating() {
        document.getElementById('seating-modal').classList.add('hidden');
    }

    renderShows();
</script>

</body>
</html>
