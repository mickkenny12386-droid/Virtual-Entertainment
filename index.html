<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Live Global System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --stage-blue: #002347; --accent-blue: #00a3e0;
            --seat-free: #333; --seat-selected: #28a745; --seat-occupied: #111;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; }

        nav { background: rgba(0,0,0,0.95); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; cursor: pointer; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: 700; }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 8px 18px; cursor: pointer; border-radius: 4px; font-size: 11px; }

        .page { display: none; padding: 130px 5% 50px; min-height: 100vh; }
        .page.active { display: block; }

        .section-title { text-align: center; margin-bottom: 50px; font-size: 3.5rem; font-family: 'Playfair Display', serif; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }
        .card { position: relative; height: 450px; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.4s; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card-info-overlay { position: absolute; inset: 0; background: rgba(0, 35, 71, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; opacity: 0; transition: 0.4s; backdrop-filter: blur(8px); }
        .card:hover img { filter: blur(10px); transform: scale(1.05); }
        .card:hover .card-info-overlay { opacity: 1; }

        .seating-wrapper { display: flex; justify-content: center; align-items: flex-start; gap: 40px; margin: 40px auto; padding: 40px; background: rgba(10,10,10,0.9); border-radius: 15px; border: 1px solid var(--stage-blue); width: fit-content; }
        .section { display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; gap: 8px; }
        .seat { width: 22px; height: 26px; background: var(--seat-free); border-radius: 4px 4px 10px 10px; cursor: pointer; transition: 0.2s; }
        .seat.selected { background: var(--seat-selected); box-shadow: 0 0 12px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied); cursor: not-allowed; opacity: 0.3; }
        .stage-line { width: 500px; height: 4px; background: var(--accent-blue); margin: 0 auto 40px; box-shadow: 0 0 20px var(--accent-blue); border-radius: 2px; }

        .admin-box { max-width: 600px; margin: 0 auto; background: #0a0a0a; padding: 40px; border-radius: 12px; border: 1px solid #222; }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 5px; }
        .btn-gold { background: #c5a059; color: #000; padding: 15px; border: none; font-weight: 700; cursor: pointer; width: 100%; border-radius: 4px; text-transform: uppercase; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 12px; margin-bottom: 8px; border-radius: 5px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showPage('home')">STAGE</div>
        <div class="nav-links">
            <span class="nav-link" onclick="showPage('home')">Shows</span>
            <span class="nav-link" onclick="showPage('account')">My Account</span>
            <button class="beheer-btn" onclick="showPage('login-page')">ADMIN</button>
        </div>
    </nav>

    <section id="home" class="page active"><h1 class="section-title">Live Shows</h1><div class="grid" id="shows-cont"></div></section>

    <section id="admin-dashboard" class="page">
        <div class="admin-box">
            <h2>Add Global Show</h2>
            <input type="text" id="adm-name" placeholder="Show Name">
            <input type="text" id="adm-img" placeholder="Poster URL (PNG)">
            <textarea id="adm-info" placeholder="Description"></textarea>
            <input type="text" id="adm-dates" placeholder="Dates (e.g. March 1, March 5)">
            <button class="btn-gold" onclick="addShow()">Publish Live</button>
            <div id="manage-list" style="margin-top:20px;"></div>
        </div>
    </section>

    <section id="login-page" class="page">
        <div class="admin-box" style="max-width:350px; text-align:center;">
            <h2>Admin Login</h2>
            <input type="password" id="admin-pass">
            <button class="btn-gold" onclick="checkAdmin()">Login</button>
        </div>
    </section>

    <section id="seating-page" class="page">
        <h2 id="seat-head" style="text-align:center;"></h2>
        <div class="stage-line"></div>
        <div class="seating-wrapper">
            <div id="l-wing" class="section"></div>
            <div id="c-pit" class="section"></div>
            <div id="r-wing" class="section"></div>
        </div>
        <button class="btn-gold" style="max-width:300px; display:block; margin: 30px auto;" onclick="book()">Confirm Global Booking</button>
    </section>

    <section id="calendar-page" class="page"><h2 id="cal-head"></h2><div id="cal-list"></div></section>
    <section id="account" class="page"><h2>My Private Tickets</h2><div id="ticket-cont"></div></section>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS8qIsJTEznHjCOjaP_XzsFzvIryoes18",
            authDomain: "vrtrtr-b9978.firebaseapp.com",
            databaseURL: "https://vrtrtr-b9978-default-rtdb.firebaseio.com",
            projectId: "vrtrtr-b9978",
            storageBucket: "vrtrtr-b9978.appspot.com",
        };
        
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let globalShows = [];
        let globalBookings = {};
        let cur = { show: null, date: null, selected: [] };

        // Listen for global changes
        rtdb.ref('/').on('value', (snapshot) => {
            const data = snapshot.val();
            globalShows = data?.shows ? Object.values(data.shows) : [];
            globalBookings = data?.bookings || {};
            renderHome();
            if(document.getElementById('admin-dashboard').classList.contains('active')) renderAdmin();
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'account') renderAccount();
        }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === "VirtualEntertainment2025!") showPage('admin-dashboard');
        }

        function addShow() {
            const id = Date.now();
            const show = {
                id,
                name: document.getElementById('adm-name').value,
                img: document.getElementById('adm-img').value,
                info: document.getElementById('adm-info').value,
                dates: document.getElementById('adm-dates').value.split(',').map(d => d.trim())
            };
            rtdb.ref('shows/' + id).set(show);
        }

        function renderHome() {
            document.getElementById('shows-cont').innerHTML = globalShows.map(s => `
                <div class="card" onclick="openCal(${s.id})">
                    <img src="${s.img}">
                    <div class="card-info-overlay">
                        <h3>${s.name}</h3>
                        <p>${s.info}</p>
                        <strong>GET TICKETS</strong>
                    </div>
                </div>
            `).join('');
        }

        function openCal(id) {
            cur.show = globalShows.find(s => s.id === id);
            document.getElementById('cal-head').innerText = cur.show.name;
            document.getElementById('cal-list').innerHTML = cur.show.dates.map(d => `
                <div style="background:#111; padding:20px; margin:10px 0; cursor:pointer;" onclick="openSeats('${d}')">${d}</div>
            `).join('');
            showPage('calendar-page');
        }

        function openSeats(date) {
            cur.date = date; cur.selected = [];
            document.getElementById('seat-head').innerText = `${cur.show.name} | ${date}`;
            const key = `${cur.show.id}_${date.replace(/\s/g, '_')}`;
            const booked = globalBookings[key] || [];
            
            genSection('l-wing', 3, 7, booked, 'L');
            genSection('c-pit', 8, 7, booked, 'C');
            genSection('r-wing', 3, 7, booked, 'R');
            showPage('seating-page');
        }

        function genSection(contId, cols, rows, booked, pref) {
            const el = document.getElementById(contId); el.innerHTML = '';
            for(let r=1; r<=rows; r++) {
                const row = document.createElement('div'); row.className = 'row';
                for(let c=1; c<=cols; c++) {
                    const id = `${pref}${r}${c}`;
                    const isOccupied = booked.includes(id);
                    const s = document.createElement('div');
                    s.className = 'seat' + (isOccupied ? ' occupied' : '');
                    s.onclick = () => { if(!isOccupied) { s.classList.toggle('selected'); toggleS(id); }};
                    row.appendChild(s);
                }
                el.appendChild(row);
            }
        }

        function toggleS(id) {
            if(cur.selected.includes(id)) cur.selected = cur.selected.filter(x => x !== id);
            else cur.selected.push(id);
        }

        function book() {
            if(!cur.selected.length) return;
            const key = `${cur.show.id}_${cur.date.replace(/\s/g, '_')}`;
            const existing = globalBookings[key] || [];
            rtdb.ref('bookings/' + key).set([...existing, ...cur.selected]);

            let myAcc = JSON.parse(localStorage.getItem('my_acc')) || [];
            myAcc.push({ name: cur.show.name, date: cur.date, seats: cur.selected });
            localStorage.setItem('my_acc', JSON.stringify(myAcc));
            
            showPage('account');
        }

        function renderAccount() {
            const myAcc = JSON.parse(localStorage.getItem('my_acc')) || [];
            document.getElementById('ticket-cont').innerHTML = myAcc.map(b => `
                <div style="background:#111; padding:20px; border-left:4px solid #00a3e0; margin-bottom:10px;">
                    <h4>${b.name}</h4><p>${b.date}</p><strong>Seats: ${b.seats.join(', ')}</strong>
                </div>
            `).join('');
        }

        function renderAdmin() {
            document.getElementById('manage-list').innerHTML = globalShows.map(s => `
                <div class="manage-item">${s.name} <button class="beheer-btn" onclick="rtdb.ref('shows/${s.id}').remove()">Delete</button></div>
            `).join('');
        }

        showPage('home');
    </script>
</body>
</html>
