<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Entertainment | Official Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-hover: #F9E076;
            --dark-bg: #0A0A0A;
            --card-bg: #141414;
            --text-light: #F5F5F5;
            --danger: #ff4d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Navigatie */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(0,0,0,0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { 
            font-family: 'Playfair Display', serif;
            font-size: 24px; 
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .nav-btns button {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 20px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .nav-btns button:hover {
            background: var(--gold);
            color: black;
        }

        /* Hero */
        .hero {
            height: 50vh;
            background: linear-gradient(rgba(0,0,0,0.7), var(--dark-bg)), url('https://images.unsplash.com/photo-1514306191717-452ec28c7814?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--white);
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        }

        /* Main Container */
        .container { padding: 40px 5%; }

        /* Login Page */
        #login-page {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 5px;
            border: 1px solid var(--gold);
            width: 100%;
            max-width: 400px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 3px;
        }

        /* Show Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s;
        }

        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .card img { width: 100%; height: 450px; object-fit: cover; }
        .card-content { padding: 20px; }
        .card-content h3 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 22px; }
        
        .agenda { margin: 15px 0; font-size: 14px; color: #bbb; }
        .agenda-item { display: block; background: #222; margin: 3px 0; padding: 5px; border-radius: 3px; }

        /* Admin Controls (Hide by default) */
        .admin-only { display: none; margin-top: 15px; }

        /* Modal / Seating Chart */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            overflow-y: auto;
            padding: 50px 20px;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid var(--gold);
        }

        .screen {
            width: 80%;
            height: 10px;
            background: var(--gold);
            margin: 20px auto 40px;
            box-shadow: 0 0 15px var(--gold);
            text-align: center;
            font-size: 10px;
            color: black;
        }

        .seat-row { display: flex; justify-content: center; }
        .seat {
            width: 25px; height: 25px;
            margin: 5px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
        }
        .seat:hover { background: var(--gold); }
        .seat.occupied { background: #555; cursor: not-allowed; }

        .btn-gold {
            background: var(--gold);
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; cursor: pointer; }

    </style>
</head>
<body>

<div id="login-page">
    <div class="login-box">
        <h2 style="color:var(--gold); margin-bottom: 20px;">Beheer Login</h2>
        <input type="text" id="username" placeholder="Gebruikersnaam">
        <input type="password" id="password" placeholder="Wachtwoord">
        <button class="btn-gold" onclick="attemptLogin()">Inloggen</button>
        <button onclick="closeLogin()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:10px; width:100%;">Terug naar website</button>
    </div>
</div>

<nav>
    <div class="logo">Virtual <span>Entertainment</span></div>
    <div class="nav-btns">
        <button id="admin-toggle-btn" onclick="openLogin()">Beheer</button>
        <button id="logout-btn" style="display:none;" onclick="logout()">Uitloggen</button>
    </div>
</nav>

<header class="hero">
    <h1>Beleef de magie van Virtual Entertainment</h1>
</header>

<div class="container admin-only" id="admin-tools">
    <h2 style="color:var(--gold)">Nieuwe Show Toevoegen</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="newTitle" placeholder="Titel van de show" style="flex:1">
        <input type="text" id="newImg" placeholder="Afbeelding URL" style="flex:1">
        <input type="number" id="rows" placeholder="Aantal rijen" style="width:100px">
        <input type="number" id="cols" placeholder="Stoelen per rij" style="width:100px">
    </div>
    <button class="btn-gold" onclick="addShow()">Show Publiceren</button>
</div>

<div class="container">
    <div class="grid" id="show-grid">
        </div>
</div>

<div id="show-modal" class="modal">
    <div class="modal-content" id="modal-inner">
        </div>
</div>

<script>
    // DATA
    let isLoggedIn = false;
    let shows = JSON.parse(localStorage.getItem('ve_shows')) || [];

    // LOGIN LOGICA
    function openLogin() { document.getElementById('login-page').style.display = 'flex'; }
    function closeLogin() { document.getElementById('login-page').style.display = 'none'; }

    function attemptLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === "Kenny&Jimi" && p === "VirtualEntertainment2025!") {
            isLoggedIn = true;
            closeLogin();
            updateUI();
        } else {
            alert("Toegang geweigerd!");
        }
    }

    function logout() {
        isLoggedIn = false;
        updateUI();
    }

    function updateUI() {
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = isLoggedIn ? 'block' : 'none');
        document.getElementById('logout-btn').style.display = isLoggedIn ? 'inline-block' : 'none';
        document.getElementById('admin-toggle-btn').style.display = isLoggedIn ? 'none' : 'inline-block';
        renderShows();
    }

    // SHOWS BEHEREN
    function addShow() {
        const title = document.getElementById('newTitle').value;
        const img = document.getElementById('newImg').value;
        const r = document.getElementById('rows').value || 5;
        const c = document.getElementById('cols').value || 10;

        if(!title || !img) return alert("Vul titel en afbeelding in");

        const show = {
            id: Date.now(),
            title,
            img,
            dates: [],
            seating: { rows: r, cols: c }
        };

        shows.push(show);
        save();
        renderShows();
    }

    function deleteShow(id) {
        if(confirm("Zeker weten dat je deze show wilt verwijderen?")) {
            shows = shows.filter(s => s.id !== id);
            save();
            renderShows();
        }
    }

    function addDate(id) {
        const d = prompt("Voer datum en tijd in (bijv. 25 Dec - 20:00):");
        if(d) {
            const show = shows.find(s => s.id === id);
            show.dates.push(d);
            save();
            renderShows();
        }
    }

    function save() {
        localStorage.setItem('ve_shows', JSON.stringify(shows));
    }

    function renderShows() {
        const grid = document.getElementById('show-grid');
        grid.innerHTML = '';

        shows.forEach(show => {
            grid.innerHTML += `
                <div class="card">
                    <img src="${show.img}" alt="${show.title}">
                    <div class="card-content">
                        <h3>${show.title}</h3>
                        <div class="agenda">
                            <strong>Agenda:</strong>
                            ${show.dates.length ? show.dates.map(d => `<span class="agenda-item">${d}</span>`).join('') : '<br>Nog geen datums.'}
                        </div>
                        <button class="btn-gold" onclick="openSeating(${show.id})">Tickets & Zaal</button>
                        
                        <div class="admin-only" style="display: ${isLoggedIn ? 'block' : 'none'}">
                            <button class="btn-gold" style="background:#444; color:white;" onclick="addDate(${show.id})">+ Datum toevoegen</button>
                            <button class="btn-danger" onclick="deleteShow(${show.id})" style="width:100%; margin-top:5px;">Show Verwijderen</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // SEATING CHART
    function openSeating(id) {
        const show = shows.find(s => s.id === id);
        const modal = document.getElementById('show-modal');
        const inner = document.getElementById('modal-inner');
        
        let seatHtml = '';
        for(let r=0; r<show.seating.rows; r++) {
            seatHtml += `<div class="seat-row">`;
            for(let c=0; c<show.seating.cols; c++) {
                seatHtml += `<div class="seat" title="Rij ${r+1}, Stoel ${c+1}" onclick="this.classList.toggle('occupied')"></div>`;
            }
            seatHtml += `</div>`;
        }

        inner.innerHTML = `
            <h2 style="color:var(--gold)">${show.title}</h2>
            <p>Selecteer uw stoelen voor deze voorstelling:</p>
            <div class="screen">PODIUM</div>
            ${seatHtml}
            <button class="btn-gold" style="margin-top:30px;" onclick="closeModal()">Reservering Bevestigen</button>
            <button onclick="closeModal()" style="background:none; border:none; color:gray; cursor:pointer; width:100%; margin-top:10px;">Sluiten</button>
        `;
        modal.style.display = 'block';
    }

    function closeModal() {
        document.getElementById('show-modal').style.display = 'none';
    }

    // INIT
    renderShows();
</script>

</body>
</html>
