<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Officiële Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --stage-blue: #003366; /* Diepblauw voor de premium uitstraling */
            --accent-blue: #00a3e0;
            --dark-bg: #000000;
            --nav-bg: #111111;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--dark-bg); color: var(--white); overflow-x: hidden; }

        /* --- EXACTE STAGE NAVIGATIE --- */
        nav {
            background: var(--nav-bg);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-family: 'Playfair Display', serif; color: var(--white); font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .nav-menu { display: flex; gap: 20px; list-style: none; font-size: 13px; font-weight: bold; }
        .nav-menu li { cursor: pointer; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
        .nav-menu li:hover { color: var(--accent-blue); }
        
        .nav-right { display: flex; align-items: center; gap: 20px; font-size: 12px; }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 5px 12px; font-weight: bold; cursor: pointer; border-radius: 2px; text-transform: uppercase; }

        /* --- HERO SECTIE (BLAUWE VARIANT) --- */
        .hero {
            height: 70vh;
            background: linear-gradient(rgba(0, 51, 102, 0.7), var(--dark-bg)), 
                        url('https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?q=80&w=2069&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 4px solid var(--stage-blue);
        }
        .hero h1 { font-family: 'Montserrat', sans-serif; font-size: 2.8rem; margin-bottom: 35px; font-weight: 700; }
        .hero-btns { display: flex; gap: 15px; }
        
        /* Exacte knopstijlen uit afbeelding 1 */
        .btn-white { background: white; color: black; padding: 15px 35px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-outline { background: transparent; color: white; border: 2px solid white; padding: 13px 33px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-white:hover { background: var(--accent-blue); color: white; }
        .btn-outline:hover { background: white; color: black; }

        /* --- SHOWS SECTIE --- */
        .main-content { padding: 60px 5%; text-align: center; }
        .main-content h2 { font-family: 'Montserrat', sans-serif; font-size: 1.8rem; margin-bottom: 40px; font-weight: 700; }
        .show-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
        
        /* --- PROFESSIONELE SEATING CHART (FOTO-GEBASEERD) --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: #0a0a0a; width: 95%; max-width: 1000px; padding: 40px; border: 1px solid var(--stage-blue); border-radius: 4px; }
        
        .stage-view { width: 60%; height: 30px; background: #222; margin: 0 auto 50px; border-bottom: 4px solid var(--accent-blue); text-align: center; font-size: 10px; color: #555; letter-spacing: 5px; line-height: 30px; }
        
        .seating-layout { display: flex; justify-content: space-between; gap: 20px; }
        .side-section { display: flex; flex-direction: column; gap: 6px; }
        .center-section { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; align-items: center; }
        
        .row { display: flex; gap: 4px; }
        .seat { width: 18px; height: 22px; background: #330000; border-radius: 3px 3px 8px 8px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .seat:hover { background: var(--accent-blue); transform: scale(1.1); }
        .seat.selected { background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); }

        /* Admin/Login styles */
        #admin-panel { display: none; background: #111; padding: 25px; border: 1px dashed var(--accent-blue); margin: 20px 5%; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: white; }

    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <div class="logo">Stage</div>
            <ul class="nav-menu">
                <li>Shows ▾</li>
                <li>Theaters ▾</li>
                <li>Groepen & Zakelijk ▾</li>
                <li>Nieuws</li>
                <li>Service ▾</li>
            </ul>
        </div>
        <div class="nav-right">
            <span>👤 My Account</span>
            <button class="beheer-btn" onclick="checkLogin()">BEHEER</button>
        </div>
    </nav>

    <header class="hero">
        <h1>Beleef de mooiste musicals</h1>
        <div class="hero-btns">
            <button class="btn-white">Kies een musical</button>
            <button class="btn-outline">Blijf op de hoogte</button>
        </div>
    </header>

    <div id="admin-panel">
        <h3 style="margin-bottom:15px; color:var(--accent-blue);">Beheer Paneel</h3>
        <input type="text" id="s-name" placeholder="Musical Naam">
        <input type="text" id="s-img" placeholder="Afbeelding URL">
        <input type="text" id="s-date" placeholder="Datum (bv. 7 feb - 20:00)">
        <button class="btn-white" style="width:100%" onclick="addShow()">Publiceer Show</button>
    </div>

    <section class="main-content">
        <h2>Beleef magische momenten bij:</h2>
        <div class="show-grid" id="main-grid">
            </div>
        <p id="no-shows" style="margin-top:40px; color:#555;">Er zijn momenteel geen shows beschikbaar. Gebruik de beheerknop.</p>
    </section>

    <div class="modal" id="seat-modal">
        <div class="modal-box">
            <h2 id="modal-title" style="text-align:center; margin-bottom:30px; font-family:'Playfair Display';">Zaalindeling</h2>
            <div class="stage-view">PODIUM</div>
            
            <div class="seating-layout">
                <div class="side-section" id="left-wing"></div>
                <div class="center-section" id="center-pit"></div>
                <div class="side-section" id="right-wing"></div>
            </div>

            <div style="margin-top: 40px; text-align: center;">
                <button class="btn-white" onclick="closeModal()">Tickets Bevestigen</button>
                <button onclick="closeModal()" style="background:none; border:none; color:gray; cursor:pointer; margin-left:15px;">Sluiten</button>
            </div>
        </div>
    </div>

    <script>
        let shows = JSON.parse(localStorage.getItem('stage_shows')) || [];
        let isAdmin = false;

        function checkLogin() {
            const u = prompt("Gebruiker:");
            const p = prompt("Wachtwoord:");
            if(u === "Kenny&Jimi" && p === "VirtualEntertainment2025!") {
                isAdmin = true;
                document.getElementById('admin-panel').style.display = 'block';
                render();
            } else { alert("Toegang geweigerd!"); }
        }

        function addShow() {
            const name = document.getElementById('s-name').value;
            const img = document.getElementById('s-img').value;
            const date = document.getElementById('s-date').value;
            if(!name || !img) return;
            shows.push({ id: Date.now(), name, img, date });
            localStorage.setItem('stage_shows', JSON.stringify(shows));
            render();
        }

        function render() {
            const grid = document.getElementById('main-grid');
            const noShows = document.getElementById('no-shows');
            grid.innerHTML = '';
            
            if(shows.length > 0) noShows.style.display = 'none';

            shows.forEach(s => {
                grid.innerHTML += `
                    <div style="background:#111; border-bottom:4px solid var(--stage-blue); text-align:left; border-radius:4px; overflow:hidden;">
                        <img src="${s.img}" style="width:100%; height:420px; object-fit:cover;">
                        <div style="padding:20px;">
                            <h3 style="color:#d4af37; font-family:'Playfair Display'; font-size:22px;">${s.name}</h3>
                            <p style="font-size:12px; color:#888; margin:10px 0;">AGENDA:</p>
                            <p style="font-size:14px;">${s.date}</p>
                            <button onclick="openSeats('${s.name}')" style="background:#d4af37; color:black; border:none; width:100%; padding:12px; font-weight:bold; margin-top:15px; cursor:pointer;">Tickets & Zaal</button>
                            ${isAdmin ? `<button onclick="removeShow(${s.id})" style="color:red; background:none; border:none; cursor:pointer; font-size:10px; margin-top:5px;">Verwijderen</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function removeShow(id) {
            shows = shows.filter(x => x.id !== id);
            localStorage.setItem('stage_shows', JSON.stringify(shows));
            render();
        }

        function openSeats(name) {
            document.getElementById('modal-title').innerText = name;
            // Genereer de unieke zaalindeling van de foto
            genRows('left-wing', 3, 10);
            genRows('center-pit', 10, 10);
            genRows('right-wing', 3, 10);
            document.getElementById('seat-modal').style.display = 'flex';
        }

        function genRows(id, cols, rows) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            for(let r=0; r<rows; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                for(let c=0; c<cols; c++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.onclick = function() { this.classList.toggle('selected'); };
                    row.appendChild(seat);
                }
                el.appendChild(row);
            }
        }

        function closeModal() { document.getElementById('seat-modal').style.display = 'none'; }
        render();
    </script>
</body>
</html>
