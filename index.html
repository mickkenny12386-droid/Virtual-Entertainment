<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Virtual Entertainment | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --main-blue: #0044ff;
            --seat-free: #0055ff;
            --seat-selected: #00ff00;
            --seat-occupied: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        /* YouTube Background */
        .video-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .video-background iframe {
            width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            filter: brightness(0.25);
        }

        nav { 
            background: rgba(0,0,0,0.95); height: 80px; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 5%; 
            position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 3px solid var(--main-blue); 
        }
        .logo { font-family: 'Playfair Display'; font-size: 24px; color: var(--main-blue); font-weight: bold; cursor: pointer; }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 13px; font-weight: 700; color: #fff; margin-left: 20px; }

        .page { display: none; padding: 120px 5% 50px; min-height: 100vh; }
        .page.active { display: block; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .card { background: rgba(0,0,0,0.7); border-radius: 12px; overflow: hidden; border: 2px solid #222; cursor: pointer; transition: 0.4s; }
        .card:hover { border-color: var(--main-blue); }
        .card img { width: 100%; height: 350px; object-fit: cover; }

        /* Side Panel */
        #side-panel { 
            width: 0; opacity: 0; background: rgba(0,5,20,0.98); 
            border-left: 4px solid var(--main-blue); position: fixed; right: 0; top: 0; 
            height: 100vh; transition: 0.5s; overflow-y: auto; z-index: 2001; 
        }
        #side-panel.open { width: 500px; opacity: 1; padding: 100px 40px 40px; }

        /* AFAS Seating Chart FIX */
        .theater-box { background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px; border: 1px solid var(--main-blue); margin-top: 15px; }
        .row { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; position: relative; z-index: 10; }
        .seat { width: 22px; height: 22px; background: var(--seat-free); border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .seat.selected { background: var(--seat-selected) !important; box-shadow: 0 0 10px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied) !important; cursor: not-allowed; opacity: 0.4; }
        
        #timer-display { color: #ffcc00; font-weight: bold; text-align: center; margin-bottom: 10px; }

        .btn-blue { background: var(--main-blue); color: #fff; padding: 15px; border: none; width: 100%; cursor: pointer; font-weight: bold; border-radius: 8px; }
        .admin-form input, .admin-form select, .admin-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #333; color: #fff; }
    </style>
</head>
<body>

    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/sImtxjknLQM?autoplay=1&mute=1&controls=0&loop=1&playlist=sImtxjknLQM" frameborder="0"></iframe>
    </div>

    <nav>
        <div class="logo" onclick="showPage('home')">VIRTUAL ENTERTAINMENT</div>
        <div>
            <span class="nav-link" onclick="showPage('home')">Shows</span>
            <span class="nav-link" onclick="showPage('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="showPage('news-page')">Nieuws</span>
            <span class="nav-link" onclick="showPage('account-page')">Tickets</span>
            <span class="nav-link" onclick="showPage('login-page')" style="color:var(--main-blue)">Admin</span>
        </div>
    </nav>

    <section id="home" class="page active"><h1>Actuele Shows</h1><div id="shows-cont" class="grid"></div></section>
    <section id="theaters-page" class="page"><h1>Onze Theaters</h1><div id="th-cont" class="grid"></div></section>
    <section id="news-page" class="page"><h1>Nieuws</h1><div id="news-cont"></div></section>
    <section id="account-page" class="page"><h1>Mijn Tickets</h1><div id="my-tickets-cont"></div></section>

    <section id="login-page" class="page">
        <div style="max-width:350px; margin:auto; background:rgba(0,0,0,0.8); padding:30px; border:1px solid var(--main-blue);">
            <h3>Admin Login</h3><br>
            <input type="password" id="admin-pass" placeholder="Wachtwoord" style="width:100%; padding:10px; margin-bottom:15px; background:#111; color:white;">
            <button class="btn-blue" onclick="checkAdmin()">Inloggen</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div class="admin-form" style="max-width:600px; margin:auto; background:rgba(0,0,0,0.9); padding:30px;">
            <h2>Beheer Systeem</h2><br>
            <select id="adm-type"><option value="shows">Show</option><option value="theaters">Theater</option><option value="news">Nieuws</option></select>
            <input type="text" id="adm-name" placeholder="Naam/Titel">
            <input type="text" id="adm-img" placeholder="Afbeelding URL">
            <input type="text" id="adm-extra" placeholder="Datums / Verkoop Eindtijd (bv 2026-03-01T20:00:00)">
            <textarea id="adm-info" placeholder="Beschrijving"></textarea>
            <button class="btn-blue" onclick="saveData()">Item Opslaan</button>
            <div id="admin-list" style="margin-top:20px;"></div>
        </div>
    </section>

    <div id="side-panel">
        <button onclick="closePanel()" style="float:right; background:none; color:white; border:none; font-size:30px; cursor:pointer;">&times;</button>
        <div id="side-content"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let currentS = null;
        let selectedSeats = [];
        const sessionID = "User_" + Math.floor(Math.random() * 9999);

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            closePanel();
        }

        // Realtime Data inladen
        rtdb.ref('/').on('value', snap => {
            const d = snap.val() || {};
            render(d.shows, 'shows-cont', 'shows');
            render(d.theaters, 'th-cont', 'theaters');
            renderNews(d.news);
        });

        function render(obj, contId, type) {
            const cont = document.getElementById(contId);
            cont.innerHTML = "";
            if(!obj) return;
            Object.values(obj).forEach(i => {
                cont.innerHTML += `<div class="card" onclick="openPanel('${i.id}', '${type}')">
                    <img src="${i.img}">
                    <div style="padding:15px;"><h3>${i.name}</h3></div>
                </div>`;
            });
        }

        function renderNews(news) {
            const cont = document.getElementById('news-cont');
            cont.innerHTML = news ? Object.values(news).map(n => `<div style="background:rgba(0,0,0,0.6); padding:20px; margin-bottom:10px; border-left:4px solid var(--main-blue);"><h3>${n.name}</h3><p>${n.info}</p></div>`).join('') : "Geen nieuws.";
        }

        function openPanel(id, type) {
            rtdb.ref(type + '/' + id).once('value', snap => {
                const s = snap.val(); currentS = s;
                selectedSeats = [];
                const panel = document.getElementById('side-panel');
                panel.classList.add('open');

                let html = `<h2>${s.name}</h2><p style="margin:15px 0;">${s.info}</p><div id="timer-display"></div>`;

                if(type === 'shows') {
                    html += `<div class="theater-box" id="seat-grid"></div><button class="btn-blue" style="margin-top:20px;" onclick="book()">Bestellen</button>`;
                    document.getElementById('side-content').innerHTML = html;
                    loadSeats(id);
                    if(s.extra) startTimer(s.extra);
                } else {
                    document.getElementById('side-content').innerHTML = html;
                }
            });
        }

        function loadSeats(sid) {
            const grid = document.getElementById('seat-grid');
            rtdb.ref('seats/'+sid).on('value', snap => {
                const taken = snap.val() || {};
                grid.innerHTML = "";
                for(let r=1; r<=8; r++) {
                    const row = document.createElement('div'); row.className = "row";
                    const block = (num, p) => {
                        for(let s=1; s<=num; s++) {
                            const id = `${p}-R${r}-S${s}`;
                            const seat = document.createElement('div');
                            seat.className = "seat " + (taken[id] ? "occupied" : "");
                            if(!taken[id]) seat.onclick = () => {
                                seat.classList.toggle('selected');
                                if(selectedSeats.includes(id)) selectedSeats = selectedSeats.filter(x=>x!==id);
                                else selectedSeats.push(id);
                            };
                            row.appendChild(seat);
                        }
                    };
                    block(3, "L"); row.innerHTML += '<div style="width:15px"></div>';
                    block(8, "C"); row.innerHTML += '<div style="width:15px"></div>';
                    block(3, "R"); grid.appendChild(row);
                }
            });
        }

        function startTimer(target) {
            const el = document.getElementById('timer-display');
            const end = new Date(target).getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const dist = end - now;
                if(dist < 0) { el.innerHTML = "❌ VERKOOP GESLOTEN"; document.getElementById('seat-grid').style.pointerEvents = "none"; return; }
                const d = Math.floor(dist/(1000*60*60*24)), h = Math.floor((dist%(1000*60*60*24))/(1000*60*60)), m = Math.floor((dist%(1000*60*60))/(1000*60)), s = Math.floor((dist%(1000*60))/1000);
                el.innerHTML = `⏳ Eindigt over: ${d}d ${h}u ${m}m ${s}s`;
            }, 1000);
        }

        function book() {
            if(!selectedSeats.length) return alert("Kies stoelen!");
            selectedSeats.forEach(sid => rtdb.ref('seats/'+currentS.id+'/'+sid).set(true));
            const tid = "T-"+Date.now();
            rtdb.ref('bookings/'+sessionID+'/'+tid).set({ sh: currentS.name, det: selectedSeats.join(', ') });
            alert("Gereserveerd!"); showPage('account-page');
        }

        function checkAdmin() { if(document.getElementById('admin-pass').value === "Virtual2025") showPage('admin-dashboard'); }

        function saveData() {
            const type = document.getElementById('adm-type').value;
            const id = Date.now();
            rtdb.ref(type+'/'+id).set({
                id, name: document.getElementById('adm-name').value, img: document.getElementById('adm-img').value,
                extra: document.getElementById('adm-extra').value, info: document.getElementById('adm-info').value
            }).then(() => alert("Opgeslagen!"));
        }

        function closePanel() { document.getElementById('side-panel').classList.remove('open'); }
        showPage('home');
    </script>
</body>
</html>
