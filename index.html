<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Virtual Entertainment | Beheer & Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --main-blue: #0044ff;
            --seat-free: #0055ff;
            --seat-selected: #00ff00;
            --seat-occupied: #1a1a1a;
        }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; margin: 0; }
        
        /* Seat Grid Fix */
        .theater-box { background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; border: 2px solid var(--main-blue); margin-top: 15px; }
        .row { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .seat { 
            width: 25px; height: 25px; background: var(--seat-free); border-radius: 5px; 
            cursor: pointer; transition: 0.2s; position: relative; z-index: 10;
        }
        .seat.selected { background: var(--seat-selected) !important; box-shadow: 0 0 15px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied) !important; cursor: not-allowed; opacity: 0.3; }

        /* Admin Layout */
        .admin-section { max-width: 800px; margin: 20px auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid var(--main-blue); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; }
        .btn-blue { background: var(--main-blue); color: #fff; padding: 15px; border: none; width: 100%; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        
        .nav { background: #000; padding: 20px; display: flex; justify-content: space-around; border-bottom: 2px solid var(--main-blue); }
        .nav a { color: #fff; text-decoration: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="nav">
        <a onclick="showSection('shows')">SHOWS</a>
        <a onclick="showSection('admin')">ADMIN PANEEL</a>
    </nav>

    <section id="admin-page" class="admin-section">
        <h2>Admin Beheer</h2>
        <div class="admin-form">
            <label>Wat wil je toevoegen?</label>
            <select id="adm-type">
                <option value="shows">Nieuwe Musical/Show</option>
                <option value="theaters">Nieuw Theater</option>
                <option value="news">Nieuwsbericht</option>
            </select>
            
            <input type="text" id="adm-name" placeholder="Titel of Naam">
            <input type="text" id="adm-img" placeholder="Afbeelding URL">
            <input type="text" id="adm-extra" placeholder="Datums (voor shows) of Locatie (voor theaters)">
            <textarea id="adm-info" placeholder="Beschrijving of inhoud"></textarea>
            
            <button class="btn-blue" onclick="processAdminSave()">Item Publiceren</button>
        </div>
        <div id="status-msg" style="margin-top:10px; color: var(--seat-selected);"></div>
    </section>

    <section id="booking-pane" class="admin-section" style="display:none;">
        <h2 id="show-title">Musical Tickets</h2>
        <div class="theater-box" id="seat-container">
            </div>
        <div id="ticket-summary" style="margin-top:20px; font-weight:bold;">Geselecteerd: 0 tickets</div>
        <button class="btn-blue" style="margin-top:10px;" onclick="confirmBooking()">Tickets Bestellen</button>
    </section>

    <script>
        // Configuratie (Gebruik je eigen Firebase gegevens)
        const firebaseConfig = {
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedSeats = [];

        // Fix: Stoel generatie voor de HELE zaal
        function loadFullTheater(showId) {
            const container = document.getElementById('seat-container');
            container.innerHTML = "";
            selectedSeats = [];

            db.ref('seats/' + showId).on('value', snap => {
                const occupied = snap.val() || {};
                container.innerHTML = "";

                for(let rowNum = 1; rowNum <= 10; rowNum++) {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = "row";

                    // Functie om een blok stoelen aan te maken
                    const createBlock = (count, prefix) => {
                        for(let s = 1; s <= count; s++) {
                            const seatId = `${prefix}-R${rowNum}-S${s}`;
                            const seat = document.createElement('div');
                            seat.className = "seat " + (occupied[seatId] ? "occupied" : "");
                            
                            if(!occupied[seatId]) {
                                seat.onclick = () => {
                                    seat.classList.toggle('selected');
                                    if(selectedSeats.includes(seatId)) {
                                        selectedSeats = selectedSeats.filter(id => id !== seatId);
                                    } else {
                                        selectedSeats.push(seatId);
                                    }
                                    document.getElementById('ticket-summary').innerText = `Geselecteerd: ${selectedSeats.length} tickets`;
                                };
                            }
                            rowDiv.appendChild(seat);
                        }
                    };

                    createBlock(3, "L"); // Links
                    rowDiv.innerHTML += '<div style="width:20px"></div>'; // Gangpad
                    createBlock(8, "C"); // Midden
                    rowDiv.innerHTML += '<div style="width:20px"></div>'; // Gangpad
                    createBlock(3, "R"); // Rechts

                    container.appendChild(rowDiv);
                }
            });
        }

        // Fix: Admin save functie voor alle types
        function processAdminSave() {
            const type = document.getElementById('adm-type').value;
            const id = Date.now();
            const data = {
                id: id,
                name: document.getElementById('adm-name').value,
                img: document.getElementById('adm-img').value,
                info: document.getElementById('adm-info').value,
                extra: document.getElementById('adm-extra').value
            };

            db.ref(type + '/' + id).set(data).then(() => {
                document.getElementById('status-msg').innerText = "Succesvol toegevoegd aan " + type + "!";
                setTimeout(() => { document.getElementById('status-msg').innerText = ""; }, 3000);
            });
        }

        function showSection(name) {
            document.getElementById('admin-page').style.display = name === 'admin' ? 'block' : 'none';
            document.getElementById('booking-pane').style.display = name === 'shows' ? 'block' : 'none';
            if(name === 'shows') loadFullTheater('frozen_main');
        }
    </script>
</body>
</html>
