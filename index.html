<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Entertainment | Officiële Seating</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --blue: #0044ff;
            --free: #0055ff;
            --select: #00ff00;
            --occ: #1a1a1a;
        }

        /* ACHTERGROND FIX */
        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Montserrat', sans-serif;
            background: url('https://eu-central-1-dotcontrol.graphassets.com/ARqeS7pzaQfsqxPd1pwy9z/MNy8cZEdQPa3MoUePRSi') no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow-x: hidden;
        }

        /* BLUR EFFECT */
        .page-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px); /* De mooie blur die je vroeg */
            -webkit-backdrop-filter: blur(8px);
            min-height: 100vh;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* NAVIGATIE */
        nav {
            background: rgba(0, 0, 0, 0.9);
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            position: fixed;
            width: 90%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--blue);
        }

        .nav-link { cursor: pointer; text-transform: uppercase; font-weight: 700; margin-left: 20px; font-size: 13px; }

        .section { padding: 100px 5% 40px; display: none; }
        .section.active { display: block; }

        /* SEATING ENGINE (FIXED CLICKING) */
        #theater-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999; /* Zorgt dat het boven alles staat */
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stage-bar {
            width: 350px; height: 15px; background: #444; 
            margin-bottom: 50px; border-radius: 0 0 50px 50px;
            text-align: center; font-size: 10px; color: #888;
        }

        .seating-grid {
            display: grid;
            grid-template-columns: repeat(3, 30px) 40px repeat(8, 30px) 40px repeat(3, 30px);
            gap: 10px;
            padding: 20px;
            pointer-events: all; /* Forceert klikbaarheid */
        }

        .seat {
            width: 30px; height: 30px;
            background: var(--free);
            border: none; border-radius: 6px;
            cursor: pointer;
            transition: 0.2s transform;
        }

        .seat:hover { transform: scale(1.2); }
        .seat.selected { background: var(--select) !important; box-shadow: 0 0 15px var(--select); }
        .seat.occupied { background: var(--occ) !important; cursor: not-allowed; opacity: 0.3; }

        .spacer { width: 40px; pointer-events: none; }

        /* UI BUTTONS */
        .btn {
            background: var(--blue); color: white; border: none;
            padding: 15px 40px; font-weight: bold; border-radius: 5px;
            cursor: pointer; text-transform: uppercase; margin: 10px;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: rgba(0,0,0,0.8); border: 1px solid #333; cursor: pointer; border-radius: 10px; overflow: hidden; }
        .card img { width: 100%; height: 300px; object-fit: cover; }
    </style>
</head>
<body>

<div class="page-overlay">
    <nav>
        <div style="font-weight: 800; color: var(--blue); font-size: 20px;">VIRTUAL ENT.</div>
        <div>
            <span class="nav-link" onclick="showSec('home')">Musicals</span>
            <span class="nav-link" onclick="showSec('explore')">Theaters</span>
            <span class="nav-link" onclick="showSec('admin')">Beheer</span>
        </div>
    </nav>

    <section id="home" class="section active">
        <h2>Beschikbare Shows</h2><br>
        <div id="musical-list" class="grid"></div>
    </section>

    <section id="explore" class="section">
        <h2>Ontdek Theaters</h2><br>
        <div id="theater-list" class="grid"></div>
    </section>

    <section id="admin" class="section">
        <div style="max-width: 400px; margin: auto; background: rgba(0,0,0,0.9); padding: 30px; border: 1px solid var(--blue);">
            <h3>Inloggen Beheer</h3><br>
            <input type="password" id="admin-pw" style="width: 100%; padding: 10px; margin-bottom: 10px;" placeholder="Wachtwoord">
            <button class="btn" style="width: 100%;" onclick="checkLogin()">Inloggen</button>
        </div>
    </section>
</div>

<div id="theater-overlay">
    <h1 id="active-title">Laden...</h1>
    <div class="stage-bar">PODIUM / SCHERM</div>
    
    <div class="seating-grid" id="main-grid">
        </div>

    <div style="margin-top: 40px;">
        <button class="btn" onclick="confirmBooking()">Reserveren</button>
        <button class="btn" style="background: #444;" onclick="closeSeating()">Sluiten</button>
    </div>
</div>

<script>
    // FIREBASE INITIALISATIE (Vervang met jouw eigen databaseURL)
    const firebaseConfig = { databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentShowId = null;
    let mySelection = [];

    function showSec(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // DATA OPHALEN
    db.ref('shows').on('value', snap => {
        const data = snap.val();
        const list = document.getElementById('musical-list');
        list.innerHTML = "";
        for(let id in data) {
            list.innerHTML += `
                <div class="card" onclick="openSeating('${id}', '${data[id].name}')">
                    <img src="${data[id].img}">
                    <div style="padding: 15px;"><h3>${data[id].name}</h3></div>
                </div>`;
        }
    });

    // SEATING LOGIC (HET NIEUWE SYSTEEM)
    function openSeating(id, name) {
        currentShowId = id;
        mySelection = [];
        document.getElementById('active-title').innerText = name;
        document.getElementById('theater-overlay').style.display = 'flex';
        
        // Luister naar bezette stoelen
        db.ref('seats/' + id).on('value', snap => {
            const occupied = snap.val() || {};
            const grid = document.getElementById('main-grid');
            grid.innerHTML = "";

            // Genereer 8 rijen stoelen
            for(let r=1; r<=8; r++) {
                // Links (3 stoelen)
                for(let s=1; s<=3; s++) createSeat(grid, `L${r}-${s}`, occupied);
                grid.innerHTML += `<div class="spacer"></div>`;
                // Midden (8 stoelen)
                for(let s=1; s<=8; s++) createSeat(grid, `C${r}-${s}`, occupied);
                grid.innerHTML += `<div class="spacer"></div>`;
                // Rechts (3 stoelen)
                for(let s=1; s<=3; s++) createSeat(grid, `R${r}-${s}`, occupied);
            }
        });
    }

    function createSeat(parent, sid, occupied) {
        const btn = document.createElement('button');
        btn.className = "seat " + (occupied[sid] ? "occupied" : "");
        
        if(!occupied[sid]) {
            btn.onclick = (e) => {
                e.stopPropagation(); // Voorkomt dat de klik doorgegeven wordt aan de laag eronder
                btn.classList.toggle('selected');
                if(mySelection.includes(sid)) {
                    mySelection = mySelection.filter(x => x !== sid);
                } else {
                    mySelection.push(sid);
                }
            };
        }
        parent.appendChild(btn);
    }

    function confirmBooking() {
        if(mySelection.length === 0) return alert("Kies eerst een stoel!");
        mySelection.forEach(sid => {
            db.ref('seats/' + currentShowId + '/' + sid).set(true);
        });
        alert("Gereserveerd!");
        closeSeating();
    }

    function closeSeating() {
        document.getElementById('theater-overlay').style.display = 'none';
    }

    function checkLogin() {
        if(document.getElementById('admin-pw').value === "Virtual2025") {
            alert("Toegang verleend.");
            // Hier kun je beheerfuncties toevoegen
        } else {
            alert("Fout wachtwoord!");
        }
    }
</script>

</body>
</html>
