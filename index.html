<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Live System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --stage-blue: #002347; --accent-blue: #00a3e0;
            --seat-free: #0055ff; 
            --seat-selected: #28a745; --seat-occupied: #111;
            --gold: #c5a059; --dark-red: #4a0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        /* Video Background - Privacy enhanced om ads te weren */
        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; filter: brightness(0.3); pointer-events: none; }
        .video-bg iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        nav { background: rgba(0,0,0,0.95); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--gold); }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; cursor: pointer; color: var(--gold); text-decoration: none; }
        
        .page { display: none; padding: 120px 5% 50px; min-height: 100vh; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Theater Container */
        .theater-wrapper { background: var(--dark-red); padding: 40px; border-radius: 40px; border: 4px solid #1a0000; display: flex; flex-direction: column; align-items: center; max-width: 1000px; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .stage-area { width: 400px; height: 12px; background: #111; border-radius: 6px; margin-bottom: 50px; position: relative; }
        
        .seating-block { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .row { display: flex; gap: 6px; justify-content: center; }
        .seat { width: 22px; height: 22px; background: var(--seat-free); border-radius: 4px; cursor: pointer; border: 1px solid rgba(0,0,0,0.2); }
        .seat.selected { background: var(--seat-selected); box-shadow: 0 0 10px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied); cursor: not-allowed; opacity: 0.2; }

        /* Admin Layout */
        .admin-box { background: #0a0a0a; padding: 25px; border-radius: 12px; border: 1px solid #333; max-width: 600px; margin: 0 auto; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #222; color: #fff; border: none; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { background: var(--gold); color: #000; font-weight: bold; }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .btn-gold { background: var(--gold); color: #000; padding: 15px; border: none; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { height: 350px; position: relative; border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #222; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { position: absolute; inset: 0; background: rgba(0,35,71,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; }
        .card:hover .card-info { opacity: 1; }
    </style>
</head>
<body>

    <div class="video-bg">
        <iframe src="https://www.youtube-nocookie.com/embed/JUx2EfzEV3c?autoplay=1&mute=1&loop=1&playlist=JUx2EfzEV3c&controls=0&modestbranding=1&rel=0" frameborder="0" allow="autoplay"></iframe>
    </div>

    <nav>
        <div class="logo" onclick="showPage('home')">STAGE ENTERTAINMENT</div>
        <div class="nav-links">
            <span style="cursor:pointer" onclick="showPage('home')">Musicals</span>
            <button style="background:#8b0000; color:white; border:none; padding:8px 15px; cursor:pointer; border-radius:4px;" onclick="showPage('login-page')">ADMIN</button>
        </div>
    </nav>

    <section id="home" class="page active">
        <h1 style="text-align:center; margin-bottom:40px;">Actuele Shows</h1>
        <div class="grid" id="shows-cont"></div>
    </section>

    <section id="seating-page" class="page">
        <h2 id="seat-head" style="text-align:center; margin-bottom:30px;"></h2>
        <div class="theater-wrapper">
            <div class="stage-area"></div>
            <div id="dynamic-seating" class="seating-block"></div>
        </div>
        <button class="btn-gold" style="max-width:300px; display:block; margin: 40px auto;" onclick="book()">Tickets Bevestigen</button>
    </section>

    <section id="login-page" class="page">
        <div class="admin-box" style="max-width:350px;">
            <h2 style="text-align:center">Admin Login</h2>
            <input type="password" id="admin-pass" placeholder="Wachtwoord">
            <button class="btn-gold" onclick="checkAdmin()">Login</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div class="admin-box">
            <div class="admin-tabs">
                <button class="tab-btn active">Musicals</button>
            </div>
            <input type="text" id="adm-name" placeholder="Show Naam">
            <input type="text" id="adm-img" placeholder="Poster URL">
            <select id="adm-theater-select">
                <option value="Efteling Theater">Efteling Theater</option>
                <option value="AFAS Circustheater">AFAS Circustheater</option>
            </select>
            <input type="text" id="adm-dates" placeholder="Data (bv: 10 Feb, 12 Feb)">
            <button class="btn-gold" onclick="saveData()">Show Opslaan</button>
            <div id="list-musicals" style="margin-top:20px;"></div>
        </div>
    </section>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS8qIsJTEznHjCOjaP_XzsFzvIryoes18",
            authDomain: "vrtrtr-b9978.firebaseapp.com",
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vrtrtr-b9978",
            storageBucket: "vrtrtr-b9978.appspot.com",
        };
        
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let state = { shows: [] };
        let cur = { show: null, selected: [] };

        rtdb.ref('shows').on('value', (snap) => {
            state.shows = snap.val() ? Object.values(snap.val()) : [];
            renderShows();
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function renderShows() {
            document.getElementById('shows-cont').innerHTML = state.shows.map(s => `
                <div class="card" onclick="openSeats('${s.id}')">
                    <img src="${s.img}">
                    <div class="card-info">
                        <h3>${s.name}</h3>
                        <p>${s.theater}</p>
                    </div>
                </div>`).join('');
        }

        function openSeats(id) {
            cur.show = state.shows.find(s => s.id == id);
            cur.selected = [];
            document.getElementById('seat-head').innerText = cur.show.name;
            const container = document.getElementById('dynamic-seating');
            container.innerHTML = "";

            if (cur.show.theater === "AFAS Circustheater") {
                renderAFAS(container);
            } else {
                renderEfteling(container);
            }
            showPage('seating-page');
        }

        function renderAFAS(container) {
            let html = '<p style="color:var(--gold)">AFAS INDELING (3 - 8 - 3)</p>';
            for(let r=1; r<=7; r++) { // 7 rijen
                html += `<div class="row">`;
                for(let s=1; s<=3; s++) html += `<div class="seat" onclick="toggleSeat(this, 'L${r}-${s}')"></div>`;
                html += `<div style="width:25px"></div>`; // Gangpad
                for(let s=1; s<=8; s++) html += `<div class="seat" onclick="toggleSeat(this, 'C${r}-${s}')"></div>`;
                html += `<div style="width:25px"></div>`; // Gangpad
                for(let s=1; s<=3; s++) html += `<div class="seat" onclick="toggleSeat(this, 'R${r}-${s}')"></div>`;
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function renderEfteling(container) {
            let html = '<p style="color:var(--gold)">EFTELING CURVES</p>';
            for(let r=1; r<=8; r++) {
                let count = 14 + (r * 2);
                html += `<div class="row">`;
                for(let s=1; s<=count; s++) html += `<div class="seat" onclick="toggleSeat(this, 'E${r}-${s}')"></div>`;
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function toggleSeat(el, id) {
            el.classList.toggle('selected');
            if(cur.selected.includes(id)) cur.selected = cur.selected.filter(x => x !== id);
            else cur.selected.push(id);
        }

        function checkAdmin() {
            // Wachtwoord hersteld
            if(document.getElementById('admin-pass').value === "Virtual2025") showPage('admin-dashboard');
            else alert("Fout wachtwoord!");
        }

        function saveData() {
            const id = Date.now();
            const data = {
                id: id,
                name: document.getElementById('adm-name').value,
                img: document.getElementById('adm-img').value,
                theater: document.getElementById('adm-theater-select').value,
                dates: document.getElementById('adm-dates').value
            };
            rtdb.ref('shows/' + id).set(data).then(() => alert("Show toegevoegd!"));
        }

        function book() {
            if(cur.selected.length === 0) return alert("Selecteer stoelen!");
            alert("Gereserveerd: " + cur.selected.join(", "));
            showPage('home');
        }

        showPage('home');
    </script>
</body>
</html>
