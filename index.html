<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Virtual Entertainment | Live Stock Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --blue: #0044ff; --red: #ff3030; --green: #00ff88; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: url('https://images.ctfassets.net/6pezt69ih962/646Fo8fvL7F4zcJ5hrXQPH/fa7ebd1f9b9d6a47b47d2a3025792bc8/Wicked-1200-210722.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; overflow-x: hidden;
        }

        .page-layer { min-height: 100vh; padding-top: 80px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); transition: 0.5s; }
        nav { background: #000; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--blue); }
        .nav-link { cursor: pointer; text-transform: uppercase; font-weight: 700; margin-left: 20px; font-size: 11px; }

        .section { padding: 40px 5%; display: none; }
        .section.active { display: block; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .card { background: #000; border-radius: 15px; overflow: hidden; position: relative; height: 450px; border: 1px solid #333; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { position: absolute; bottom: 0; width: 100%; height: 100%; background: linear-gradient(transparent, #000 80%); display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; opacity: 0; transition: 0.4s; }
        .card:hover .card-info { opacity: 1; backdrop-filter: blur(5px); }

        .btn { background: var(--blue); color: #fff; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-red { background: var(--red); }
        .btn-off { background: #444; }

        input, textarea, select { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; margin-bottom: 10px; }
        
        .stock-label { font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .sold-out { color: var(--red); }
        .in-stock { color: var(--green); }

        .admin-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--blue); }
    </style>
</head>
<body>

<div class="page-layer">
    <nav>
        <div onclick="goTo('home')" style="cursor:pointer; font-weight:800; color:var(--blue);">VIRTUAL ENT.</div>
        <div>
            <span class="nav-link" onclick="goTo('home')">Shows</span>
            <span class="nav-link" onclick="goTo('news-page')">Nieuws</span>
            <span class="nav-link" onclick="goTo('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="goTo('account')">Account</span>
            <span class="nav-link" onclick="goTo('admin-login')" style="opacity:0.4">Admin</span>
        </div>
    </nav>

    <section id="home" class="section active">
        <h2>Live Musicals</h2><br><div id="show-list" class="grid"></div>
    </section>

    <section id="news-page" class="section">
        <h2>Nieuws Updates</h2><br><div id="news-list" style="max-width:800px; margin:auto;"></div>
    </section>

    <section id="theaters-page" class="section">
        <h2>Locaties</h2><br><div id="theater-list" class="grid"></div>
    </section>

    <section id="account" class="section">
        <h2>Mijn Reserveringen</h2><br><div id="my-tickets" style="max-width:600px;"></div>
    </section>

    <section id="booking-page" class="section">
        <div style="max-width:500px; margin:auto; background:rgba(0,0,0,0.9); padding:30px; border-radius:15px; border:1px solid var(--blue);">
            <h2 id="book-title">Show</h2><br>
            <select id="date-select" onchange="loadStock()"></select>
            
            <div id="stock-container">
                <div class="stock-label">Rang I <span id="r1-count"></span></div>
                <input type="number" id="q1" value="0" min="0">
                
                <div class="stock-label">Rang II <span id="r2-count"></span></div>
                <input type="number" id="q2" value="0" min="0">
                
                <div class="stock-label">Rang III <span id="r3-count"></span></div>
                <input type="number" id="q3" value="0" min="0">
            </div>

            <button class="btn" style="width:100%; margin-top:20px;" onclick="confirmBooking()">Reserveer nu</button>
            <button class="btn btn-off" style="width:100%; margin-top:10px;" onclick="goTo('home')">Annuleren</button>
        </div>
    </section>

    <section id="admin-panel" class="section">
        <h2>Beheer Center</h2><br>
        <div class="grid" style="align-items: start;">
            <div style="background:#111; padding:20px; border-radius:10px;">
                <h3>Toevoegen</h3><br>
                <select id="adm-type">
                    <option value="shows">Musical</option>
                    <option value="news">Nieuwsbericht</option>
                    <option value="theaters">Theater</option>
                </select>
                <input id="adm-name" placeholder="Naam">
                <input id="adm-img" placeholder="Afbeelding URL">
                <input id="adm-dates" placeholder="Datums (bijv: 1 Feb, 3 Feb)">
                <textarea id="adm-info" placeholder="Informatie"></textarea>
                <button class="btn" style="width:100%" onclick="saveAdmin()">Opslaan</button>
            </div>
            <div id="admin-manage-list"></div>
        </div>
    </section>

    <section id="admin-login" class="section">
        <div style="max-width:300px; margin:auto; text-align:center;">
            <input type="password" id="adm-pass" placeholder="Wachtwoord">
            <button class="btn" onclick="if(document.getElementById('adm-pass').value=='Virtual2025') goTo('admin-panel')">Inloggen</button>
        </div>
    </section>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const userID = "U-" + Math.floor(Math.random()*9999);
    let activeID = null;

    function goTo(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    db.ref('/').on('value', snap => {
        const d = snap.val() || {};
        renderHome(d.shows);
        renderNews(d.news);
        renderTheaters(d.theaters);
        renderAdmin(d);
        renderAccount(d.bookings ? d.bookings[userID] : null);
    });

    function renderHome(shows) {
        const c = document.getElementById('show-list'); c.innerHTML = "";
        for(let id in shows) {
            let s = shows[id]; if(s.status == 'offline') continue;
            c.innerHTML += `
                <div class="card">
                    <img src="${s.img}">
                    <div class="card-info">
                        <h3>${s.name}</h3>
                        <button class="btn" style="margin-top:15px;" onclick="openBooking('${id}')">Tickets Reserveren</button>
                    </div>
                </div>`;
        }
    }

    function openBooking(id) {
        activeID = id;
        db.ref('shows/'+id).once('value', s => {
            let v = s.val();
            document.getElementById('book-title').innerText = v.name;
            const ds = document.getElementById('date-select'); ds.innerHTML = "";
            v.dates.split(',').forEach(d => ds.innerHTML += `<option>${d.trim()}</option>`);
            loadStock();
            goTo('booking-page');
        });
    }

    function loadStock() {
        const date = document.getElementById('date-select').value;
        db.ref('sales/'+activeID+'/'+date).on('value', s => {
            const v = s.val() || {r1:0, r2:0, r3:0};
            updateLabel('r1-count', 28 - v.r1);
            updateLabel('r2-count', 28 - v.r2);
            updateLabel('r3-count', 42 - v.r3);
        });
    }

    function updateLabel(id, left) {
        const el = document.getElementById(id);
        el.innerText = left > 0 ? left + " over" : "VOL";
        el.className = left > 0 ? "in-stock" : "sold-out";
    }

    function confirmBooking() {
        const date = document.getElementById('date-select').value;
        const q = [parseInt(document.getElementById('q1').value), parseInt(document.getElementById('q2').value), parseInt(document.getElementById('q3').value)];
        
        db.ref('sales/'+activeID+'/'+date).transaction(cur => {
            cur = cur || {r1:0, r2:0, r3:0};
            if((cur.r1+q[0])>28 || (cur.r2+q[1])>28 || (cur.r3+q[2])>42) return;
            cur.r1 += q[0]; cur.r2 += q[1]; cur.r3 += q[2];
            return cur;
        }).then(res => {
            if(!res.committed) return alert("Niet genoeg tickets!");
            db.ref('bookings/'+userID+'/'+Date.now()).set({ show: document.getElementById('book-title').innerText, date, tickets: q.join('/') });
            alert("Reservering gelukt!"); goTo('account');
        });
    }

    function saveAdmin() {
        const type = document.getElementById('adm-type').value;
        const id = Date.now();
        db.ref(type+'/'+id).set({
            id, name: document.getElementById('adm-name').value,
            img: document.getElementById('adm-img').value,
            info: document.getElementById('adm-info').value,
            dates: document.getElementById('adm-dates').value || "",
            status: 'online', posted: new Date().toLocaleString()
        }).then(() => alert("Opgeslagen!"));
    }

    function renderAdmin(data) {
        const c = document.getElementById('admin-manage-list'); c.innerHTML = "<h3>Database Beheer</h3><br>";
        ['shows', 'news', 'theaters'].forEach(type => {
            if(!data[type]) return;
            for(let id in data[type]) {
                let i = data[type][id];
                c.innerHTML += `
                    <div class="admin-item">
                        <span><b>[${type}]</b> ${i.name}</span>
                        <div>
                            <button class="btn btn-off" onclick="db.ref('${type}/${id}/status').set('${i.status=='online'?'offline':'online'}')">Status</button>
                            <button class="btn btn-red" onclick="db.ref('${type}/${id}').remove()">X</button>
                        </div>
                    </div>`;
            }
        });
    }

    function renderNews(news) {
        const c = document.getElementById('news-list'); c.innerHTML = "";
        if(!news) return;
        Object.values(news).reverse().forEach(n => {
            c.innerHTML += `<div class="admin-item" style="display:block;"><small>${n.posted}</small><h3>${n.name}</h3><p>${n.info}</p></div>`;
        });
    }

    function renderTheaters(th) {
        const c = document.getElementById('theater-list'); c.innerHTML = "";
        if(!th) return;
        Object.values(th).forEach(t => {
            c.innerHTML += `<div class="card" style="height:300px;"><img src="${t.img}"><div class="card-info" style="opacity:1;"><h3>${t.name}</h3><p style="font-size:11px;">${t.info}</p></div></div>`;
        });
    }

    function renderAccount(b) {
        const c = document.getElementById('my-tickets'); c.innerHTML = "";
        if(!b) return c.innerHTML = "Geen tickets.";
        Object.values(b).forEach(t => {
            c.innerHTML += `<div class="admin-item" style="border-color:var(--green);"><b>${t.show}</b><br>${t.date}<br><small>Tickets: ${t.tickets}</small></div>`;
        });
    }
</script>
</body>
</html>
