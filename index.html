<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Live System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --stage-blue: #002347; --accent-blue: #00a3e0;
            --seat-free: #333; --seat-selected: #28a745; --seat-occupied: #111;
            --sold-out: #d00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; filter: brightness(0.25); }
        .video-bg iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        nav { background: rgba(0,0,0,0.9); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; cursor: pointer; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 11px; font-weight: 700; color: #ddd; }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 8px 18px; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; }

        .page { display: none; padding: 130px 5% 50px; min-height: 100vh; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }
        .card { position: relative; height: 450px; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: #0a0a0a; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info-overlay { position: absolute; inset: 0; background: rgba(0, 35, 71, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; opacity: 0; transition: 0.4s; backdrop-filter: blur(8px); }
        .card:hover .card-info-overlay { opacity: 1; }

        .date-item { background:#111; padding:20px; margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-radius:8px; transition:0.3s; }
        .date-item:hover { background:#1a1a1a; }
        .sold-out-tag { color: var(--sold-out); font-weight: bold; font-size: 12px; letter-spacing: 1px; }

        .seating-wrapper { display: flex; justify-content: center; gap: 40px; margin: 40px auto; padding: 40px; background: rgba(10,10,10,0.9); border-radius: 15px; border: 1px solid var(--stage-blue); width: fit-content; }
        .row { display: flex; gap: 8px; margin-bottom: 8px; }
        .seat { width: 22px; height: 26px; background: var(--seat-free); border-radius: 4px 4px 10px 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .seat.selected { background: var(--seat-selected); box-shadow: 0 0 10px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied); cursor: not-allowed; opacity: 0.2; }

        .admin-box { max-width: 900px; margin: 0 auto; background: #0a0a0a; padding: 40px; border-radius: 12px; border: 1px solid #333; }
        .btn-gold { background: #c5a059; color: #000; padding: 15px; border: none; font-weight: 700; cursor: pointer; width: 100%; border-radius: 4px; text-transform: uppercase; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="video-bg">
        <iframe src="https://www.youtube.com/embed/CxYN6nSSkVs?autoplay=1&mute=1&loop=1&playlist=CxYN6nSSkVs&controls=0" frameborder="0"></iframe>
    </div>

    <nav>
        <div class="logo" onclick="showPage('home')">STAGE</div>
        <div class="nav-links">
            <span class="nav-link" onclick="showPage('home')">Shows</span>
            <span class="nav-link" onclick="showPage('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="showPage('news-page')">News</span>
            <span class="nav-link" onclick="showPage('account')">Account</span>
            <button class="beheer-btn" onclick="showPage('login-page')">BEHEER</button>
        </div>
    </nav>

    <section id="home" class="page active">
        <h1 style="text-align:center; margin-bottom:40px; font-family:'Playfair Display'; font-size:3rem;">Productions</h1>
        <div class="grid" id="shows-cont"></div>
    </section>

    <section id="theaters-page" class="page">
        <h1>Onze Locaties</h1>
        <div style="margin-bottom:40px; border-radius:12px; overflow:hidden; border:1px solid #333;">
            <iframe width="100%" height="450" src="https://www.youtube.com/embed/msYcybnScms?autoplay=0&mute=1" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="grid" id="th-cont"></div>
    </section>

    <section id="news-page" class="page"><h1>Laatste Nieuws</h1><div class="grid" id="news-cont"></div></section>
    
    <section id="account" class="page"><h1>Mijn Tickets</h1><div id="ticket-cont"></div></section>

    <section id="calendar-page" class="page">
        <h2 id="cal-head"></h2>
        <div id="cal-list" style="margin-top:30px;"></div>
    </section>

    <section id="seating-page" class="page">
        <h2 id="seat-head" style="text-align:center;"></h2>
        <div style="width: 500px; height: 4px; background: var(--accent-blue); margin: 0 auto 40px; border-radius: 2px;"></div>
        <div class="seating-wrapper">
            <div id="l-wing"></div>
            <div id="c-pit"></div>
            <div id="r-wing"></div>
        </div>
        <button class="btn-gold" style="max-width:300px; display:block; margin: 30px auto;" onclick="book()">Bestelling Afronden</button>
    </section>

    <section id="login-page" class="page">
        <div class="admin-box" style="max-width:350px; text-align:center;">
            <h2>Admin Login</h2>
            <input type="password" id="admin-pass">
            <button class="btn-gold" onclick="checkAdmin()">Login</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div class="admin-box">
            <h2>Systeem Beheer</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div>
                    <h3>Toevoegen</h3>
                    <input type="text" id="adm-name" placeholder="Show Naam">
                    <input type="text" id="adm-img" placeholder="Poster URL">
                    <textarea id="adm-info" placeholder="Omschrijving"></textarea>
                    <input type="text" id="adm-dates" placeholder="Data (gescheiden door komma)">
                    <button class="btn-gold" onclick="saveData('shows')">Show Publiceren</button>
                </div>
                <div id="admin-list" style="background:#111; padding:20px; border-radius:8px;">
                    <h3>Huidige Content</h3>
                    <div id="manage-list"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS8qIsJTEznHjCOjaP_XzsFzvIryoes18",
            authDomain: "vrtrtr-b9978.firebaseapp.com",
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vrtrtr-b9978",
            storageBucket: "vrtrtr-b9978.appspot.com",
        };
        
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let state = { shows: [], theaters: [], news: [], bookings: {} };
        let cur = { show: null, date: null, selected: [] };

        const TOTAL_SEATS = 98; // 7 rijen * (3+8+3) stoelen

        rtdb.ref('/').on('value', (snap) => {
            const data = snap.val() || {};
            state.shows = data.shows ? Object.values(data.shows) : [];
            state.theaters = data.theaters ? Object.values(data.theaters) : [];
            state.news = data.news ? Object.values(data.news) : [];
            state.bookings = data.bookings || {};
            renderAll();
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function renderAll() {
            document.getElementById('shows-cont').innerHTML = state.shows.map(s => `
                <div class="card" onclick="openCal(${s.id})">
                    <img src="${s.img}">
                    <div class="card-info-overlay">
                        <h3>${s.name}</h3>
                        <p style="margin:15px 0; font-size:12px; opacity:0.8;">${s.info}</p>
                        <strong>TICKETS BESTELLEN</strong>
                    </div>
                </div>
            `).join('');

            document.getElementById('th-cont').innerHTML = state.theaters.map(t => `<div class="card" style="padding:20px; height:auto;"><h3>${t.name}</h3></div>`).join('');
            document.getElementById('news-cont').innerHTML = state.news.map(n => `<div class="card" style="padding:20px; height:auto;"><small>${n.date}</small><p style="margin-top:10px;">${n.text}</p></div>`).join('');
        }

        function openCal(id) {
            cur.show = state.shows.find(s => s.id === id);
            document.getElementById('cal-head').innerText = cur.show.name;
            
            document.getElementById('cal-list').innerHTML = cur.show.dates.map(d => {
                const key = cur.show.id + "_" + d.replace(/\s/g, '_');
                const bookedCount = (state.bookings[key] || []).length;
                const isSoldOut = bookedCount >= TOTAL_SEATS;

                return `
                    <div class="date-item" onclick="${isSoldOut ? '' : `openSeats('${d}')`}" style="opacity: ${isSoldOut ? '0.5' : '1'}; cursor: ${isSoldOut ? 'default' : 'pointer'};">
                        <span>${d}</span>
                        ${isSoldOut ? '<span class="sold-out-tag">UITVERKOCHT / SOLD OUT</span>' : '<span style="color:#28a745">Beschikbaar</span>'}
                    </div>
                `;
            }).join('');
            showPage('calendar-page');
        }

        function openSeats(date) {
            cur.date = date; cur.selected = [];
            document.getElementById('seat-head').innerText = date;
            const key = cur.show.id + "_" + date.replace(/\s/g, '_');
            const booked = state.bookings[key] || [];
            
            genSection('l-wing', 3, 7, booked, 'L');
            genSection('c-pit', 8, 7, booked, 'C');
            genSection('r-wing', 3, 7, booked, 'R');
            showPage('seating-page');
        }

        function genSection(contId, cols, rows, booked, pref) {
            const el = document.getElementById(contId); el.innerHTML = '';
            for(let r=1; r<=rows; r++) {
                const row = document.createElement('div'); row.className = 'row';
                for(let c=1; c<=cols; c++) {
                    const id = pref+r+c;
                    const isB = booked.includes(id);
                    const s = document.createElement('div');
                    s.className = 'seat' + (isB ? ' occupied' : '');
                    if(!isB) s.onclick = () => { s.classList.toggle('selected'); toggleS(id); };
                    row.appendChild(s);
                }
                el.appendChild(row);
            }
        }

        function toggleS(id) {
            if(cur.selected.includes(id)) cur.selected = cur.selected.filter(x => x !== id);
            else cur.selected.push(id);
        }

        function book() {
            if(!cur.selected.length) return;
            const key = cur.show.id + "_" + cur.date.replace(/\s/g, '_');
            const total = [...(state.bookings[key] || []), ...cur.selected];
            rtdb.ref('bookings/' + key).set(total).then(() => {
                let my = JSON.parse(localStorage.getItem('my_stage_tickets')) || [];
                my.push({ show: cur.show.name, date: cur.date, seats: cur.selected });
                localStorage.setItem('my_stage_tickets', JSON.stringify(my));
                alert("Tickets gereserveerd!");
                showPage('home');
            });
        }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === "VirtualEntertainment2025!") showPage('admin-dashboard');
        }

        function saveData(type) {
            const id = Date.now();
            let payload = { id };
            if(type === 'shows') {
                payload.name = document.getElementById('adm-name').value;
                payload.img = document.getElementById('adm-img').value;
                payload.info = document.getElementById('adm-info').value;
                payload.dates = document.getElementById('adm-dates').value.split(',').map(d => d.trim());
            }
            rtdb.ref(type + '/' + id).set(payload).then(() => alert("Opgeslagen!"));
        }

        showPage('home');
    </script>
</body>
</html>
