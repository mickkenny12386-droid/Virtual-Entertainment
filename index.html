<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Entertainment | Professional Live System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --stage-blue: #002347; --accent-blue: #00a3e0;
            --seat-free: #0055ff; /* Blauwe wol kleur uit Minecraft */
            --seat-selected: #28a745; --seat-occupied: #111;
            --gold: #c5a059; --dark-red: #4a0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        /* Video Background - Fix voor advertenties */
        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; filter: brightness(0.3); pointer-events: none; }
        .video-bg iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        nav { background: rgba(0,0,0,0.95); height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--gold); }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; cursor: pointer; color: var(--gold); }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 8px 18px; cursor: pointer; border-radius: 4px; font-weight: bold; }

        .page { display: none; padding: 120px 5% 50px; min-height: 100vh; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Theater Container */
        .theater-wrapper { background: var(--dark-red); padding: 40px; border-radius: 40px; border: 4px solid #1a0000; display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 1000px; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .stage-area { width: 400px; height: 12px; background: #111; border-radius: 6px; box-shadow: 0 5px 15px rgba(255,255,255,0.1); margin-bottom: 30px; position: relative; }
        .stage-area::after { content: 'PODIUM'; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 5px; color: #888; }

        /* Seating Classes */
        .seating-block { display: flex; flex-direction: column; gap: 6px; width: 100%; align-items: center; }
        .row { display: flex; gap: 4px; justify-content: center; }
        .seat { width: 22px; height: 22px; background: var(--seat-free); border-radius: 4px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.2); }
        .seat.selected { background: var(--seat-selected); box-shadow: 0 0 10px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied); cursor: not-allowed; opacity: 0.2; }
        
        /* Curves voor Efteling Theater */
        .curve-row { margin-bottom: 2px; }
        .balcony-gold { width: 90%; height: 10px; background: var(--gold); margin: 20px 0; border-radius: 50% 50% 0 0; }

        /* Admin Layout */
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #222; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { background: var(--gold); color: #000; font-weight: bold; }
        .admin-box { background: #0a0a0a; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .btn-gold { background: var(--gold); color: #000; padding: 15px; border: none; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { height: 380px; position: relative; border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #222; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { position: absolute; inset: 0; background: rgba(0,35,71,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; }
        .card:hover .card-info { opacity: 1; }
    </style>
</head>
<body>

    <div class="video-bg">
        <iframe src="https://www.youtube.com/embed/JUx2EfzEV3c?autoplay=1&mute=1&loop=1&playlist=JUx2EfzEV3c&controls=0&modestbranding=1&rel=0&iv_load_policy=3" frameborder="0" allow="autoplay"></iframe>
    </div>

    <nav>
        <div class="logo" onclick="showPage('home')">STAGE ENTERTAINMENT</div>
        <div class="nav-links">
            <span class="nav-link" style="cursor:pointer" onclick="showPage('home')">Musicals</span>
            <span class="nav-link" style="cursor:pointer" onclick="showPage('theaters-page')">Theaters</span>
            <span class="nav-link" style="cursor:pointer" onclick="showPage('news-page')">Nieuws</span>
            <button class="beheer-btn" onclick="showPage('login-page')">ADMIN</button>
        </div>
    </nav>

    <section id="home" class="page active">
        <h1 style="text-align:center; margin-bottom:40px;">Lopende Producties</h1>
        <div class="grid" id="shows-cont"></div>
    </section>

    <section id="seating-page" class="page">
        <h2 id="seat-head" style="text-align:center; margin-bottom:30px;"></h2>
        <div class="theater-wrapper">
            <div class="stage-area"></div>
            
            <div id="dynamic-seating" class="seating-block">
                </div>
        </div>
        <button class="btn-gold" style="max-width:300px; display:block; margin: 30px auto;" onclick="book()">Tickets Bevestigen</button>
    </section>

    <section id="login-page" class="page">
        <div class="admin-box" style="max-width:350px; margin: 0 auto; text-align:center;">
            <h2>Beheerder Toegang</h2>
            <input type="password" id="admin-pass" placeholder="Wachtwoord">
            <button class="btn-gold" onclick="checkAdmin()">Inloggen</button>
        </div>
    </section>

    <section id="admin-dashboard" class="page">
        <div class="admin-box" style="max-width:900px; margin:0 auto;">
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('tab-musicals')">Musicals</button>
                <button class="tab-btn" onclick="switchTab('tab-theaters')">Theaters</button>
                <button class="tab-btn" onclick="switchTab('tab-news')">Nieuws</button>
            </div>

            <div id="tab-musicals" class="admin-content active">
                <h3>Musical Beheer</h3>
                <input type="text" id="adm-name" placeholder="Naam Musical">
                <input type="text" id="adm-img" placeholder="Poster URL">
                <select id="adm-theater-select">
                    <option value="Efteling Theater">Efteling Theater</option>
                    <option value="AFAS Circustheater">AFAS Circustheater</option>
                </select>
                <input type="text" id="adm-dates" placeholder="Data (bv: 10 Feb, 11 Feb)">
                <button class="btn-gold" onclick="saveData('shows')">Musical Publiceren</button>
                <div id="list-musicals" style="margin-top:20px;"></div>
            </div>

            <div id="tab-theaters" class="admin-content" style="display:none;">
                <input type="text" id="adm-th-name" placeholder="Nieuw Theater Naam">
                <button class="btn-gold" onclick="saveData('theaters')">Theater Toevoegen</button>
            </div>
        </div>
    </section>

    <script>
        // Firebase Config uit jouw afbeelding
        const firebaseConfig = {
            apiKey: "AIzaSyAS8qIsJTEznHjCOjaP_XzsFzvIryoes18",
            authDomain: "vrtrtr-b9978.firebaseapp.com",
            databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vrtrtr-b9978",
            storageBucket: "vrtrtr-b9978.appspot.com",
        };
        
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let state = { shows: [], theaters: [], bookings: {} };
        let cur = { show: null, date: null, selected: [] };

        rtdb.ref('/').on('value', (snap) => {
            const data = snap.val() || {};
            state.shows = data.shows ? Object.values(data.shows) : [];
            state.bookings = data.bookings || {};
            renderShows();
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function renderShows() {
            document.getElementById('shows-cont').innerHTML = state.shows.map(s => `
                <div class="card" onclick="openSeats(${s.id})">
                    <img src="${s.img}">
                    <div class="card-info">
                        <h3>${s.name}</h3>
                        <p>${s.theater}</p>
                        <strong style="margin-top:10px;">RESERVEREN</strong>
                    </div>
                </div>`).join('');
        }

        function openSeats(id) {
            cur.show = state.shows.find(s => s.id === id);
            cur.selected = [];
            document.getElementById('seat-head').innerText = cur.show.name + " - " + cur.show.theater;
            const container = document.getElementById('dynamic-seating');
            container.innerHTML = "";

            if (cur.show.theater === "Efteling Theater") {
                renderEfteling(container);
            } else {
                renderAFAS(container);
            }
            showPage('seating-page');
        }

        // CURVE LOGIC VOOR EFTELING THEATER (Foto 1 & 2)
        function renderEfteling(container) {
            // Stalles met curve
            let html = '<div class="label" style="color:var(--gold)">STALLES (1E RANG)</div>';
            for(let r=1; r<=8; r++) {
                let seatsInRow = 14 + (r * 2); // Rij wordt breder voor de curve
                html += `<div class="row">`;
                for(let s=1; s<=seatsInRow; s++) {
                    html += `<div class="seat" onclick="toggleSeat(this, 'S${r}-${s}')"></div>`;
                }
                html += `</div>`;
            }
            html += '<div class="balcony-gold"></div><div class="label" style="color:var(--gold)">BALKON (2E RANG)</div>';
            // Balkon met curve vleugels
            for(let r=1; r<=5; r++) {
                html += `<div class="row">`;
                let seats = (r < 3) ? 24 : 20; 
                for(let s=1; s<=seats; s++) {
                    html += `<div class="seat" onclick="toggleSeat(this, 'B${r}-${s}')"></div>`;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        // AFAS CIRCUS THEATER LOGIC (Foto 3 - Roblox)
        function renderAFAS(container) {
            let html = '<div class="label" style="color:var(--gold)">ZAAL INDELING</div>';
            // 3 blokken indeling zoals de Roblox foto
            for(let r=1; r<=12; r++) {
                html += `<div class="row">`;
                // Links blok
                for(let s=1; s<=4; s++) html += `<div class="seat" onclick="toggleSeat(this, 'L${r}-${s}')"></div>`;
                html += `<div style="width:20px"></div>`; // Gangpad
                // Midden blok
                for(let s=1; s<=10; s++) html += `<div class="seat" onclick="toggleSeat(this, 'C${r}-${s}')"></div>`;
                html += `<div style="width:20px"></div>`; // Gangpad
                // Rechts blok
                for(let s=1; s<=4; s++) html += `<div class="seat" onclick="toggleSeat(this, 'R${r}-${s}')"></div>`;
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function toggleSeat(el, id) {
            el.classList.toggle('selected');
            if(cur.selected.includes(id)) cur.selected = cur.selected.filter(x => x !== id);
            else cur.selected.push(id);
        }

        function book() {
            if(cur.selected.length === 0) return alert("Kies eerst een stoel!");
            const bookingId = Date.now();
            rtdb.ref('bookings/' + bookingId).set({
                show: cur.show.name,
                seats: cur.selected,
                timestamp: bookingId
            }).then(() => {
                alert("Gereserveerd!");
                showPage('home');
            });
        }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === "Virtual2025") showPage('admin-dashboard');
        }

        function saveData(type) {
            const id = Date.now();
            let data = { id };
            if(type === 'shows') {
                data.name = document.getElementById('adm-name').value;
                data.img = document.getElementById('adm-img').value;
                data.theater = document.getElementById('adm-theater-select').value;
                data.dates = document.getElementById('adm-dates').value.split(',');
            }
            rtdb.ref(type + '/' + id).set(data).then(() => alert("Opgeslagen!"));
        }

        function switchTab(id) {
            document.querySelectorAll('.admin-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            event.target.classList.add('active');
        }

        showPage('home');
    </script>
</body>
</html>
</html>
