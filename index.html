<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Virtual Entertainment | Full Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --blue: #0044ff; --red: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: url('https://eu-central-1-dotcontrol.graphassets.com/ARqeS7pzaQfsqxPd1pwy9z/MNy8cZEdQPa3MoUePRSi') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            overflow-x: hidden;
        }

        .page-layer {
            min-height: 100vh; padding-top: 80px; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px); transition: opacity 0.5s, transform 0.5s;
        }

        .fade-out { opacity: 0; transform: scale(0.98); pointer-events: none; }

        nav { background: #000; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--blue); }
        .nav-link { cursor: pointer; text-transform: uppercase; font-weight: 700; margin-left: 20px; font-size: 11px; }

        .section { padding: 40px 5%; display: none; }
        .section.active { display: block; }

        /* GRID & CARDS */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .card { background: #000; border-radius: 12px; overflow: hidden; position: relative; height: 450px; border: 1px solid #333; transition: 0.3s; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card-info { position: absolute; bottom: 0; width: 100%; height: 0; background: linear-gradient(transparent, #000 40%); overflow: hidden; transition: 0.4s ease; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .card:hover .card-info { height: 100%; }
        .card:hover img { filter: brightness(0.3); }

        /* UI ELEMENTS */
        .btn { background: var(--blue); color: #fff; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-del { background: var(--red); padding: 5px 10px; font-size: 10px; margin-top: 5px; }
        input, textarea, select { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; margin-bottom: 10px; font-family: inherit; }

        .admin-box { background: rgba(0,0,0,0.9); padding: 25px; border-radius: 10px; border: 1px solid #222; margin-bottom: 20px; }
        .list-item { background: #0a0a0a; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 3px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="main-layer" class="page-layer">
    <nav>
        <div onclick="goTo('home')" style="cursor:pointer; font-weight:800; color:var(--blue);">VIRTUAL ENT.</div>
        <div>
            <span class="nav-link" onclick="goTo('home')">Shows</span>
            <span class="nav-link" onclick="goTo('news-page')">Nieuws</span>
            <span class="nav-link" onclick="goTo('theaters-page')">Theaters</span>
            <span class="nav-link" onclick="goTo('account')">Account</span>
            <span class="nav-link" onclick="goTo('admin-login')" style="opacity:0.4">Admin</span>
        </div>
    </nav>

    <section id="home" class="section active">
        <h2>Musicals</h2><br><div id="show-list" class="grid"></div>
    </section>

    <section id="news-page" class="section">
        <h2>Laatste Nieuws</h2><br><div id="news-list" style="max-width:800px; margin:auto;"></div>
    </section>

    <section id="theaters-page" class="section">
        <h2>Onze Theaters</h2><br><div id="theater-list" class="grid"></div>
    </section>

    <section id="account" class="section">
        <h2>Mijn Tickets</h2><br><div id="my-tickets" style="max-width:600px;"></div>
    </section>

    <section id="booking-page" class="section">
        <button class="btn" onclick="goTo('home')">← Terug</button><br><br>
        <div style="max-width:600px; margin:auto; background:rgba(0,0,0,0.8); padding:30px; border-radius:15px; border:1px solid var(--blue);">
            <h1 id="book-title">Show</h1>
            <p id="book-info" style="color:#aaa; margin-bottom:20px;"></p>
            <div id="date-selection"></div>
            <div id="ticket-form" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:20px;">
                <h4 id="selected-date-label"></h4><br>
                <label>Rang I (28 tickets)</label><input type="number" id="q1" value="0" min="0">
                <label>Rang II (28 tickets)</label><input type="number" id="q2" value="0" min="0">
                <label>Rang III (42 tickets)</label><input type="number" id="q3" value="0" min="0">
                <button class="btn" style="width:100%" onclick="confirmBooking()">Reservering Afronden</button>
            </div>
        </div>
    </section>

    <section id="admin-panel" class="section">
        <h2>Management Console</h2><br>
        <div class="grid" style="align-items: start;">
            <div class="admin-box">
                <h3>Toevoegen</h3><br>
                <select id="adm-type">
                    <option value="shows">Musical</option>
                    <option value="news">Nieuwsbericht</option>
                    <option value="theaters">Theater Locatie</option>
                </select>
                <input id="adm-name" placeholder="Naam / Titel">
                <input id="adm-img" placeholder="Afbeelding URL">
                <input id="adm-dates" placeholder="Datums (bijv: 1 Feb, 3 Feb) - Alleen voor Shows">
                <textarea id="adm-info" placeholder="Omschrijving" rows="4"></textarea>
                <button class="btn" style="width:100%" onclick="saveToFirebase()">Publiceer</button>
            </div>
            <div>
                <h3>Beheer Database</h3><br>
                <div id="admin-manage-list"></div>
            </div>
        </div>
    </section>

    <section id="admin-login" class="section">
        <div style="max-width:300px; margin:auto; text-align:center;">
            <input type="password" id="adm-pass" placeholder="Password">
            <button class="btn" onclick="if(document.getElementById('adm-pass').value=='Virtual2025') goTo('admin-panel')">Login</button>
        </div>
    </section>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const userKey = "U-" + Math.floor(Math.random()*9999);
    let activeID = null, activeDate = null;

    function goTo(id) {
        document.getElementById('main-layer').classList.add('fade-out');
        setTimeout(() => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('main-layer').classList.remove('fade-out');
            window.scrollTo(0,0);
        }, 500);
    }

    db.ref('/').on('value', snap => {
        const d = snap.val() || {};
        renderHome(d.shows);
        renderNews(d.news);
        renderTheaters(d.theaters);
        renderAdminList(d);
        renderMyTickets(d.bookings ? d.bookings[userKey] : null);
    });

    function renderHome(obj) {
        const c = document.getElementById('show-list'); c.innerHTML = "";
        for(let id in obj) {
            let s = obj[id]; if(s.status == 'offline') continue;
            c.innerHTML += `<div class="card"><img src="${s.img}"><div class="card-info"><h3>${s.name}</h3><span style="cursor:pointer;color:var(--blue);font-weight:bold;" onclick="openBooking('${id}')">Click here for tickets</span></div></div>`;
        }
    }

    function openBooking(id) {
        db.ref('shows/'+id).once('value', s => {
            let val = s.val(); activeID = id;
            document.getElementById('book-title').innerText = val.name;
            document.getElementById('book-info').innerText = val.info;
            const dates = val.dates.split(',');
            document.getElementById('date-selection').innerHTML = dates.map(d => `<button class="btn" style="margin:5px" onclick="selectDate('${d.trim()}')">${d.trim()}</button>`).join('');
            document.getElementById('ticket-form').style.display = 'none';
            goTo('booking-page');
        });
    }

    function selectDate(d) {
        activeDate = d;
        document.getElementById('selected-date-label').innerText = "Datum: " + d;
        document.getElementById('ticket-form').style.display = 'block';
    }

    function confirmBooking() {
        const q = [parseInt(document.getElementById('q1').value), parseInt(document.getElementById('q2').value), parseInt(document.getElementById('q3').value)];
        db.ref('bookings/'+userKey+'/'+Date.now()).set({ show: document.getElementById('book-title').innerText, date: activeDate, tickets: q.join('/') });
        alert("Gereserveerd!"); goTo('account');
    }

    function saveToFirebase() {
        const type = document.getElementById('adm-type').value;
        const id = Date.now();
        db.ref(type+'/'+id).set({
            id, name: document.getElementById('adm-name').value,
            img: document.getElementById('adm-img').value,
            info: document.getElementById('adm-info').value,
            dates: document.getElementById('adm-dates').value || "",
            status: 'online',
            posted: new Date().toLocaleDateString()
        }).then(() => alert("Gepubliceerd!"));
    }

    function renderAdminList(data) {
        const c = document.getElementById('admin-manage-list'); c.innerHTML = "";
        ['shows', 'news', 'theaters'].forEach(type => {
            if(!data[type]) return;
            c.innerHTML += `<h4>${type.toUpperCase()}</h4>`;
            for(let id in data[type]) {
                let item = data[type][id];
                c.innerHTML += `<div class="list-item">
                    <span>${item.name}</span>
                    <div>
                        <button class="btn" style="padding:5px" onclick="db.ref('${type}/${id}/status').set('${item.status=='online'?'offline':'online'}')">Status</button>
                        <button class="btn btn-del" onclick="db.ref('${type}/${id}').remove()">Verwijder</button>
                    </div>
                </div>`;
            }
        });
    }

    function renderNews(obj) {
        const c = document.getElementById('news-list'); c.innerHTML = "";
        for(let id in obj) {
            c.innerHTML += `<div class="list-item" style="display:block;"><small>${obj[id].posted}</small><h3>${obj[id].name}</h3><p>${obj[id].info}</p></div>`;
        }
    }

    function renderTheaters(obj) {
        const c = document.getElementById('theater-list'); c.innerHTML = "";
        for(let id in obj) {
            c.innerHTML += `<div class="card" style="height:300px;"><img src="${obj[id].img}"><div class="card-info"><h3>${obj[id].name}</h3><p style="font-size:11px;">${obj[id].info}</p></div></div>`;
        }
    }

    function renderMyTickets(b) {
        const c = document.getElementById('my-tickets'); c.innerHTML = b ? Object.values(b).map(t => `<div class="list-item"><b>${t.show}</b><br>${t.date}</div>`).join('') : "Geen tickets gevonden.";
    }
</script>
</body>
</html>
