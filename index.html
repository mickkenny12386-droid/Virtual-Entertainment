<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Entertainment | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --main-blue: #0044ff;
            --seat-free: #0055ff;
            --seat-selected: #00ff00;
            --seat-occupied: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        /* Hero Section with Video */
        .hero {
            position: relative; height: 100vh; width: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; overflow: hidden;
        }
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }
        .video-bg iframe {
            width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            filter: brightness(0.4);
        }
        .hero-content h1 { font-family: 'Playfair Display'; font-size: 4rem; margin-bottom: 20px; }
        .hero-btns { display: flex; gap: 20px; }
        .btn-hero { 
            padding: 15px 30px; border: 2px solid #fff; background: none; color: #fff; 
            font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .btn-hero:hover { background: #fff; color: #000; }
        .btn-filled { background: var(--main-blue); border-color: var(--main-blue); }

        nav { 
            background: rgba(0,0,0,0.9); height: 70px; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 5%; 
            position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid #333; 
        }
        .nav-link { cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: 700; color: #fff; margin-left: 20px; text-decoration: none;}

        .section { padding: 80px 5%; min-height: 100vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: #111; border-radius: 8px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--main-blue); }
        .card img { width: 100%; height: 300px; object-fit: cover; }

        /* Side Panel */
        #side-panel { 
            width: 0; opacity: 0; background: rgba(0,5,20,0.98); 
            border-left: 3px solid var(--main-blue); position: fixed; right: 0; top: 0; 
            height: 100vh; transition: 0.5s; overflow-y: auto; z-index: 2001; 
        }
        #side-panel.open { width: 500px; opacity: 1; padding: 80px 40px; }

        /* SEATING CHART FIX */
        .theater-box { background: #000; padding: 20px; border-radius: 10px; border: 1px solid #444; margin: 20px 0; }
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr) 20px repeat(8, 1fr) 20px repeat(3, 1fr);
            gap: 5px; justify-items: center;
        }
        .seat { width: 18px; height: 18px; background: var(--seat-free); border-radius: 3px; cursor: pointer; z-index: 10; }
        .seat.selected { background: var(--seat-selected) !important; box-shadow: 0 0 8px var(--seat-selected); }
        .seat.occupied { background: var(--seat-occupied) !important; cursor: not-allowed; opacity: 0.3; }
        .aisle { width: 20px; }

        /* Admin & UI */
        .btn-blue { background: var(--main-blue); color: #fff; padding: 12px; border: none; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #333; color: #fff; }
        .res-item { background: #111; padding: 15px; border-radius: 5px; border-left: 4px solid var(--main-blue); margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="window.scrollTo(0,0)">VIRTUAL ENTERTAINMENT</div>
        <div>
            <a href="#musicals" class="nav-link">Musicals</a>
            <a href="#theaters" class="nav-link">Theaters</a>
            <a href="#news" class="nav-link">News</a>
            <a href="#reservations" class="nav-link">My Tickets</a>
            <a href="#admin" class="nav-link" style="color:var(--main-blue)">Admin</a>
        </div>
    </nav>

    <header class="hero">
        <div class="video-bg">
            <iframe src="https://www.youtube.com/embed/sImtxjknLQM?autoplay=1&mute=1&controls=0&loop=1&playlist=sImtxjknLQM" frameborder="0"></iframe>
        </div>
        <div class="hero-content">
            <h1>Experience the Magic</h1>
            <div class="hero-btns">
                <button class="btn-hero btn-filled" onclick="document.getElementById('musicals').scrollIntoView()">Choose a Musical</button>
                <button class="btn-hero" onclick="document.getElementById('news').scrollIntoView()">Stay Informed</button>
            </div>
        </div>
    </header>

    <section id="musicals" class="section">
        <h2>Now Playing</h2><br>
        <div id="shows-cont" class="grid"></div>
    </section>

    <section id="theaters" class="section">
        <h2>Our Venues</h2><br>
        <div id="th-cont" class="grid"></div>
    </section>

    <section id="news" class="section">
        <h2>Latest News</h2><br>
        <div id="news-cont"></div>
    </section>

    <section id="reservations" class="section">
        <h2>My Reservations</h2><br>
        <div id="my-tickets-cont"></div>
    </section>

    <section id="admin" class="section">
        <div style="max-width:600px; margin:auto; background:#111; padding:30px; border:1px solid var(--main-blue);">
            <h2>Management Console</h2><br>
            <select id="adm-type">
                <option value="shows">Add Musical</option>
                <option value="theaters">Add Theater</option>
                <option value="news">Add News Update</option>
            </select>
            <input type="text" id="adm-name" placeholder="Title/Name">
            <input type="text" id="adm-img" placeholder="Image URL">
            <input type="text" id="adm-cast" placeholder="Cast Members (e.g. Elsa: Name, Anna: Name)">
            <textarea id="adm-info" placeholder="Description/Content"></textarea>
            <button class="btn-blue" onclick="saveAdminData()">Publish Item</button>
        </div>
    </section>

    <div id="side-panel">
        <button onclick="closePanel()" style="float:right; background:none; color:white; border:none; font-size:30px; cursor:pointer;">&times;</button>
        <div id="side-content"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://vrtrtr-b9978-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentShow = null;
        let selectedSeats = [];
        const sessionID = "User_" + Math.floor(Math.random() * 9999);

        // Load Data
        db.ref('/').on('value', snap => {
            const data = snap.val() || {};
            renderCards(data.shows, 'shows-cont');
            renderCards(data.theaters, 'th-cont');
            renderNews(data.news);
        });

        function renderCards(obj, contId) {
            const cont = document.getElementById(contId);
            cont.innerHTML = "";
            if(!obj) return;
            Object.values(obj).forEach(i => {
                cont.innerHTML += `
                <div class="card" onclick="openPanel('${i.id}', '${contId === 'shows-cont' ? 'shows' : 'theaters'}')">
                    <img src="${i.img}">
                    <div style="padding:15px;"><h3>${i.name}</h3></div>
                </div>`;
            });
        }

        function renderNews(news) {
            const cont = document.getElementById('news-cont');
            cont.innerHTML = news ? Object.values(news).map(n => `
                <div class="res-item">
                    <h3>${n.name}</h3>
                    <p>${n.info}</p>
                    ${n.cast ? `<small><b>Cast:</b> ${n.cast}</small>` : ''}
                </div>`).join('') : "No news updates.";
        }

        function openPanel(id, type) {
            db.ref(type + '/' + id).once('value', snap => {
                const s = snap.val(); currentShow = s;
                selectedSeats = [];
                document.getElementById('side-panel').classList.add('open');
                
                let html = `<h2>${s.name}</h2><p style="margin:20px 0;">${s.info}</p>`;
                if(s.cast) html += `<p><b>Cast:</b><br>${s.cast}</p>`;

                if(type === 'shows') {
                    html += `<h3>Select Seats</h3><div class="theater-box"><div class="seat-grid" id="seat-grid"></div></div>
                             <button class="btn-blue" onclick="confirmBooking()">Reserve Seats</button>`;
                    document.getElementById('side-content').innerHTML = html;
                    generateSeating(id);
                } else {
                    document.getElementById('side-content').innerHTML = html;
                }
            });
        }

        function generateSeating(showId) {
            const grid = document.getElementById('seat-grid');
            db.ref('seats/' + showId).on('value', snap => {
                const occupied = snap.val() || {};
                grid.innerHTML = "";
                for(let r=1; r<=8; r++) {
                    for(let s=1; s<=3; s++) createSeat(grid, `L-R${r}-S${s}`, occupied);
                    grid.innerHTML += `<div class="aisle"></div>`;
                    for(let s=1; s<=8; s++) createSeat(grid, `C-R${r}-S${s}`, occupied);
                    grid.innerHTML += `<div class="aisle"></div>`;
                    for(let s=1; s<=3; s++) createSeat(grid, `R-R${r}-S${s}`, occupied);
                }
            });
        }

        function createSeat(parent, id, occupied) {
            const seat = document.createElement('div');
            seat.className = "seat " + (occupied[id] ? "occupied" : "");
            if(!occupied[id]) {
                seat.onclick = () => {
                    seat.classList.toggle('selected');
                    if(selectedSeats.includes(id)) selectedSeats = selectedSeats.filter(x => x !== id);
                    else selectedSeats.push(id);
                };
            }
            parent.appendChild(seat);
        }

        function confirmBooking() {
            if(!selectedSeats.length) return alert("Select at least one seat.");
            selectedSeats.forEach(sid => db.ref('seats/' + currentShow.id + '/' + sid).set(true));
            db.ref('bookings/' + sessionID + '/' + Date.now()).set({
                show: currentShow.name,
                seats: selectedSeats.join(', '),
                time: new Date().toLocaleString()
            });
            alert("Reservation Successful!");
            closePanel();
            loadTickets();
        }

        function loadTickets() {
            db.ref('bookings/' + sessionID).once('value', snap => {
                const d = snap.val();
                document.getElementById('my-tickets-cont').innerHTML = d ? Object.values(d).map(t => `
                    <div class="res-item">
                        <b>${t.show}</b><br>Seats: ${t.seats}<br><small>${t.time}</small>
                    </div>`).join('') : "No reservations found.";
            });
        }

        function saveAdminData() {
            const type = document.getElementById('adm-type').value;
            const id = Date.now();
            db.ref(type + '/' + id).set({
                id: id,
                name: document.getElementById('adm-name').value,
                img: document.getElementById('adm-img').value,
                cast: document.getElementById('adm-cast').value,
                info: document.getElementById('adm-info').value
            }).then(() => {
                alert("Published successfully!");
                document.querySelectorAll('#admin input, #admin textarea').forEach(i => i.value = "");
            });
        }

        function closePanel() { document.getElementById('side-panel').classList.remove('open'); }
        loadTickets();
    </script>
</body>
</html>
