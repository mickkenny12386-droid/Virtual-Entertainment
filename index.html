<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Entertainment | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --stage-blue: #002347;
            --accent-blue: #00a3e0;
            --dark-bg: #000000;
            --card-bg: #111111;
            --text-white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--dark-bg); color: var(--text-white); }

        /* --- HEADER (MATCHT SCREENSHOT) --- */
        nav {
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            border-bottom: 2px solid var(--stage-blue);
        }
        .logo { font-family: 'Playfair Display', serif; color: #d4af37; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .beheer-btn { background: #8b0000; color: white; border: none; padding: 5px 15px; cursor: pointer; font-weight: bold; font-size: 12px; }

        /* --- HERO (MATCHT SCREENSHOT) --- */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1514306191717-452ec28c7814?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 5px solid var(--stage-blue);
        }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 30px; }
        .hero-btns { display: flex; gap: 15px; }
        .btn-white { background: white; color: black; padding: 12px 25px; font-weight: bold; border: none; cursor: pointer; }
        .btn-outline { background: transparent; color: white; border: 1px solid white; padding: 12px 25px; font-weight: bold; cursor: pointer; }

        /* --- SHOW SECTIE --- */
        .container { padding: 40px 5%; }
        .section-header { font-size: 24px; margin-bottom: 30px; text-align: center; font-family: 'Playfair Display', serif; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        .no-shows { text-align: center; grid-column: 1 / -1; padding: 50px; color: #666; font-style: italic; }

        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #222; transition: 0.3s; }
        .card:hover { border-color: var(--accent-blue); }
        .card img { width: 100%; height: 380px; object-fit: cover; }
        .card-content { padding: 20px; }
        .card-content h3 { color: #d4af37; font-family: 'Playfair Display', serif; margin-bottom: 10px; }
        .agenda-txt { font-size: 13px; color: #888; margin-bottom: 15px; }
        .btn-gold { background: #d4af37; color: black; border: none; width: 100%; padding: 10px; font-weight: bold; cursor: pointer; }

        /* --- SEATING MODAL --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; overflow-y: auto; padding: 40px; }
        .modal-content { max-width: 800px; margin: auto; background: #111; padding: 30px; border: 1px solid var(--accent-blue); }
        .stage-bar { width: 70%; height: 10px; background: var(--accent-blue); margin: 20px auto; box-shadow: 0 0 15px var(--accent-blue); }
        .row { display: flex; justify-content: center; margin-bottom: 6px; }
        .seat { width: 25px; height: 25px; background: #333; margin: 3px; border-radius: 3px; cursor: pointer; transition: 0.2s; }
        .seat:hover { background: var(--accent-blue); }
        .seat.selected { background: var(--accent-blue); transform: scale(1.1); }

        /* --- ADMIN PANEL --- */
        .admin-panel { background: #111; padding: 25px; border: 1px dashed var(--accent-blue); margin-bottom: 40px; display: none; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; }
        .btn-add { background: var(--stage-blue); color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; font-weight: bold; }

    </style>
</head>
<body>

<nav>
    <div class="logo">VIRTUAL ENTERTAINMENT</div>
    <button class="beheer-btn" onclick="openLogin()">BEHEER</button>
</nav>

<header class="hero">
    <h1>Beleef de magie van Virtual Entertainment</h1>
    <div class="hero-btns">
        <button class="btn-white">Kies een musical</button>
        <button class="btn-outline">Blijf op de hoogte</button>
    </div>
</header>

<div class="container">
    <div id="admin-area" class="admin-panel">
        <h2 style="color:var(--accent-blue); margin-bottom:15px;">Nieuwe Show Toevoegen</h2>
        <input type="text" id="s-title" placeholder="Titel van de show">
        <input type="text" id="s-img" placeholder="Afbeelding URL (bijv. van Unsplash)">
        <input type="text" id="s-date" placeholder="Datum (bijv. 12 Maart - 20:00)">
        <div style="display:flex; gap:10px;">
            <input type="number" id="s-rows" placeholder="Aantal rijen" value="6">
            <input type="number" id="s-cols" placeholder="Stoelen per rij" value="12">
        </div>
        <button class="btn-add" onclick="addShow()">SHOW PUBLICEREN</button>
        <button onclick="logout()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:10px;">Uitloggen</button>
    </div>

    <h2 class="section-header">Beleef magische momenten bij:</h2>
    <div class="grid" id="main-grid">
        <div class="no-shows">Er zijn momenteel geen shows beschikbaar. Log in bij beheer om er een toe te voegen.</div>
    </div>
</div>

<div id="seat-modal" class="modal">
    <div class="modal-content">
        <h2 id="m-title" style="text-align:center; font-family:'Playfair Display'; color:var(--accent-blue);">Zaalindeling</h2>
        <div class="stage-bar"></div>
        <div id="seat-container"></div>
        <div style="margin-top:30px; text-align:center;">
            <button class="btn-white" onclick="closeModal()">Tickets Bevestigen</button>
            <button onclick="closeModal()" style="background:none; border:none; color:gray; margin-left:15px; cursor:pointer;">Sluiten</button>
        </div>
    </div>
</div>

<script>
    let shows = JSON.parse(localStorage.getItem('ve_data')) || [];
    let isAdmin = false;

    function openLogin() {
        const pass = prompt("Voer beheerwachtwoord in:");
        if(pass === "VirtualEntertainment2025!") {
            isAdmin = true;
            document.getElementById('admin-area').style.display = 'block';
            render();
        } else {
            alert("Toegang geweigerd.");
        }
    }

    function logout() {
        isAdmin = false;
        document.getElementById('admin-area').style.display = 'none';
        render();
    }

    function addShow() {
        const title = document.getElementById('s-title').value;
        const img = document.getElementById('s-img').value;
        const date = document.getElementById('s-date').value;
        const rows = document.getElementById('s-rows').value;
        const cols = document.getElementById('s-cols').value;

        if(!title || !img) return alert("Vul a.u.b. alle velden in.");

        shows.push({ id: Date.now(), title, img, date, rows, cols });
        localStorage.setItem('ve_data', JSON.stringify(shows));
        render();
    }

    function deleteShow(id) {
        shows = shows.filter(s => s.id !== id);
        localStorage.setItem('ve_data', JSON.stringify(shows));
        render();
    }

    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '';

        if(shows.length === 0) {
            grid.innerHTML = '<div class="no-shows">Er zijn momenteel geen shows beschikbaar. Log in bij beheer om er een toe te voegen.</div>';
            return;
        }

        shows.forEach(s => {
            grid.innerHTML += `
                <div class="card">
                    <img src="${s.img}" alt="${s.title}">
                    <div class="card-content">
                        <h3>${s.title}</h3>
                        <p class="agenda-txt"><strong>Agenda:</strong><br>${s.date}</p>
                        <button class="btn-gold" onclick="openSeats(${s.id})">TICKETS & ZAAL</button>
                        ${isAdmin ? `<button onclick="deleteShow(${s.id})" style="background:red; color:white; border:none; width:100%; margin-top:5px; padding:5px; cursor:pointer; font-size:10px;">VERWIJDEREN</button>` : ''}
                    </div>
                </div>
            `;
        });
    }

    function openSeats(id) {
        const s = shows.find(x => x.id === id);
        const container = document.getElementById('seat-container');
        document.getElementById('m-title').innerText = s.title;
        container.innerHTML = '';

        for(let r=0; r<s.rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            for(let c=0; c<s.cols; c++) {
                const seat = document.createElement('div');
                seat.className = 'seat';
                seat.onclick = () => seat.classList.toggle('selected');
                rowDiv.appendChild(seat);
            }
            container.appendChild(rowDiv);
        }
        document.getElementById('seat-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('seat-modal').style.display = 'none';
    }

    render();
</script>

</body>
</html>
